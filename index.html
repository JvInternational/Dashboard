<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#192622;font-family:Inter,Segoe UI,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:var(--side);padding:18px 14px;color:#dce6e3;position:sticky;top:0;height:100vh}.logoBox{height:75px;background:#fff;border-radius:7px;padding:7px;display:flex;align-items:center}.logoBox img{width:100%;height:100%;object-fit:contain}.sideLabel{font-size:9px;letter-spacing:1.2px;color:#83938e;margin:13px 7px 7px}.nav{display:grid;gap:3px}.nav button{border:0;background:none;color:#c9d2d0;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#21342f;color:#fff}.main{width:calc(100% - 230px);max-width:1450px;padding:25px 28px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:17px}.title{font-size:27px;margin:0;color:#132b27}.desc{font-size:13px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:9px;align-items:end}.field{display:grid;gap:4px}.field label,.klabel{font-size:10px;color:#71807c;text-transform:uppercase;letter-spacing:.35px}.field select,.field input{height:36px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 10px}.periodInfo{font-size:11px;color:#667570}.periodInfo b{display:block;color:#2e4842}.btn{height:36px;border:0;border-radius:7px;padding:0 14px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.panel,.card,.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.panel{padding:16px;margin-bottom:15px}.sectionTitle{font-size:14px;margin:0 0 13px}.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.area{padding:15px;border-left:4px solid var(--accent);cursor:pointer}.area b{font-size:10px}.area .value{font:700 24px ui-monospace,Consolas;margin:9px 0}.note{font-size:11px;color:var(--muted)}.executive{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.exec{padding:15px;border-top:3px solid var(--green)}.exec .value{font:700 22px ui-monospace,Consolas;margin:8px 0 3px;line-height:1.15}.exec small{color:var(--muted)}.charts{display:grid;gap:15px}.bars{display:grid;gap:10px}.bar{display:grid;grid-template-columns:150px 190px 1fr;align-items:center;gap:10px;font-size:12px}.bar .val{font:600 12px ui-monospace,Consolas}.track{height:7px;background:#e8efed;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px}.machineGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.machine{padding:14px;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px}.machine strong{font-size:16px}.machine .total{font:600 13px ui-monospace,Consolas;margin:6px 0}.machine .reason{font-size:12px;color:var(--muted)}.machine .reason b{display:block;color:#263b36;margin-top:3px}.filters{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;align-items:end}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:15px 0}.kpi{padding:15px;border-left:4px solid var(--accent)}.kpi .value{font:700 24px ui-monospace,Consolas;margin-top:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.chart{height:280px}.tableWrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:9px}.table{border-collapse:collapse;width:100%;font-size:12px}.table th{position:sticky;top:0;background:#f5f8f7;padding:9px;text-align:left;white-space:nowrap}.table td{padding:8px 9px;border-top:1px solid #edf1f0;white-space:nowrap}.table td.num{text-align:right;font:600 12px ui-monospace,Consolas}.legend{font-size:12px;margin-bottom:10px}.sw{display:inline-block;width:9px;height:9px;margin:0 5px 0 13px}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:950px){.side{width:185px}.main{width:calc(100% - 185px)}.areas,.executive,.kpis,.machineGrid,.two{grid-template-columns:1fr 1fr}.filters{grid-template-columns:repeat(3,1fr)}.bar{grid-template-columns:100px 150px 1fr}}@media(max-width:650px){.app{display:block}.side{width:100%;height:auto;position:static}.main{width:100%;padding:14px}.areas,.executive,.kpis,.machineGrid,.two,.filters{grid-template-columns:1fr}.top{display:block}.tools{margin-top:12px;flex-wrap:wrap}}
</style></head><body><div class="app"><aside class="side"><div class="logoBox"><img src="Logo_JV International.png" alt="JV International Solutions Inc."></div><div class="sideLabel">DASHBOARD DE PRODUCCIÓN</div><nav id="nav" class="nav"></nav></aside><main id="view" class="main"></main></div>
<script>
'use strict';
let DATA={},PAGE='General',PERIOD=localStorage.getItem('jvPeriod')||'',STATE={},CHART=null;
const CFG={
 Estampado:{title:'Estampado',value:'TOTAL',metric:'Piezas trabajadas',accent:'#08776b',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE HIT','ESPECIALIDAD'],down:true},
 Neck:{title:'Neck',value:'TOTAL',metric:'Total de piezas',accent:'#3c6e8f',groups:['NO. MAQUINA','TIPO DE PRENDA']},
 Cuadros:{title:'Cuadros',value:'CANT. CUADROS',metric:'Total de cuadros',accent:'#4a55a8',groups:['PROCESO','ESPECIALIDAD','DEPT']},
 Empaque:{title:'Empaque',value:'TOTAL',metric:'Total de piezas',accent:'#c9762f',groups:['TIPO DE EMPAQUE','TIPO DE PRENDA'],down:true},
 Ejemplos:{title:'Ejemplos',value:'PRENDAS',metric:'Prendas',accent:'#8a5cb0',groups:['DEPTO','CLIENTE','TIENDA','ESPECIALIDAD','TIPO DE HIT']},
 Lavanderia:{title:'Lavandería',value:'CANTIDAD DE PIEZAS',metric:'Cantidad de piezas',accent:'#3f7d3a',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE PROCESO','COLOR'],down:true}
};
const DEPTS=Object.keys(CFG),LABEL={'NO. MAQUINA':'Máquina','TIPO DE PRENDA':'Tipo de prenda','TIPO DE HIT':'Tipo de hit',ESPECIALIDAD:'Especialidad',MOTIVO:'Motivo',PROCESO:'Proceso',DEPT:'Departamento',DEPTO:'Departamento',CLIENTE:'Cliente',TIENDA:'Tienda','TIPO DE EMPAQUE':'Tipo de empaque','TIPO DE PROCESO':'Tipo de proceso',COLOR:'Color'};
const EMPTY={'NO. MAQUINA':'Sin máquina','TIPO DE PRENDA':'Sin tipo de prenda','TIPO DE HIT':'Sin tipo de hit',ESPECIALIDAD:'Sin especialidad',MOTIVO:'Sin motivo',PROCESO:'Sin proceso',DEPT:'Sin departamento',DEPTO:'Sin departamento',CLIENTE:'Sin cliente',TIENDA:'Sin tienda','TIPO DE EMPAQUE':'Sin tipo de empaque','TIPO DE PROCESO':'Sin tipo de proceso',COLOR:'Sin color'};
const IDS=new Set(['FOLIO','NO. WO','ESTILO','NO. MAQUINA','NO. FOLDER']);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=v=>Number.isFinite(Number(v))?Number(v):0, fmt=v=>new Intl.NumberFormat('es-MX',{maximumFractionDigits:0}).format(num(v)), dateKey=v=>String(v||'').slice(0,10), dateFmt=v=>{let p=dateKey(v).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:'—'}, empty=v=>v==null||String(v).trim()==='', sum=(a,k)=>a.reduce((s,r)=>s+num(r[k]),0), time=v=>`${fmt(v)} min / ${(num(v)/60).toFixed(1)} hrs`;
function periodMonths(){

  const months = new Set();

  DEPTS.forEach(dept => {

    (DATA[dept] || []).forEach(r => {

      const fecha = dateKey(r.FECHA);

      if(!fecha) return;

      months.add(
        fecha.slice(0,7)
      );

    });

  });

  return [...months]
    .sort()
    .reverse();
}
function range(){

  const allDates =
    DEPTS.flatMap(
      d =>
        (DATA[d] || [])
          .map(r => dateKey(r.FECHA))
          .filter(Boolean)
    )
    .sort();

  const minDate =
    allDates[0];

  const maxDate =
    allDates.at(-1);

  if(PERIOD === 'all'){

    return [
      minDate,
      maxDate
    ];

  }

  if(PERIOD === '30'){

    let end =
      new Date(maxDate);

    let start =
      new Date(end);

    start.setDate(
      start.getDate() - 29
    );

    return [
      start.toISOString().slice(0,10),
      maxDate
    ];
  }

  if(PERIOD === '90'){

    let end =
      new Date(maxDate);

    let start =
      new Date(end);

    start.setDate(
      start.getDate() - 89
    );

    return [
      start.toISOString().slice(0,10),
      maxDate
    ];
  }

  if(PERIOD === 'current'){

    return [
      maxDate.slice(0,7) + '-01',
      maxDate
    ];
  }

  let [y,m] =
    PERIOD.split('-')
      .map(Number);

  return [

    `${y}-${String(m)
      .padStart(2,'0')}-01`,

    new Date(
      Date.UTC(y,m,0)
    )
    .toISOString()
    .slice(0,10)

  ];
}
function rows(d){let [a,b]=range();return (DATA[d]||[]).filter(r=>{let k=dateKey(r.FECHA);return k>=a&&k<=b})}
function monthLabel(){

  if(PERIOD === 'all')
    return 'Todo el histórico';

  if(PERIOD === 'current')
    return 'Mes actual';

  if(PERIOD === '30')
    return 'Últimos 30 días';

  if(PERIOD === '90')
    return 'Últimos 90 días';

  let [y,m] =
    PERIOD.split('-');

  return new Intl.DateTimeFormat(
    'es-MX',
    {
      month:'long',
      year:'numeric',
      timeZone:'UTC'
    }
  ).format(
    new Date(
      `${y}-${m}-01T00:00:00Z`
    )
  );

}
function nav(){document.querySelector('#nav').innerHTML=['General',...DEPTS].map(d=>`<button class="${PAGE===d?'active':''}" onclick="show('${d}')">${d==='Lavanderia'?'Lavandería':d}</button>`).join('')}
function periodTools(){

  return `
    <div class="tools">

      <div class="field">

        <label>Período activo</label>

        <select
          onchange="
            PERIOD=this.value;
            localStorage.setItem(
              'jvPeriod',
              PERIOD
            );
            STATE={};
            setTimeout(
  () => show(PAGE),
  10
);

          "
        >

          <option
            value="all"
            ${PERIOD==='all'?'selected':''}
          >
            Todo el histórico
          </option>

          <option
            value="current"
            ${PERIOD==='current'?'selected':''}
          >
            Mes actual
          </option>

          <option
            value="30"
            ${PERIOD==='30'?'selected':''}
          >
            Últimos 30 días
          </option>

          <option
            value="90"
            ${PERIOD==='90'?'selected':''}
          >
            Últimos 90 días
          </option>

          ${periodMonths()
            .map(m => `
              <option
                value="${m}"
                ${m===PERIOD?'selected':''}
              >
                ${monthName(m)}
              </option>
            `)
            .join('')
          }

        </select>

      </div>

      <div class="periodInfo">

        <b>Período activo</b>

        ${periodText()}

      </div>

      <button
        class="btn"
        onclick="pdfGeneral()"
      >
        Exportar PDF
      </button>

    </div>
  `;
}
function monthName(m){let [y,x]=m.split('-');return new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${y}-${x}-01T00:00:00Z`))}
 function periodText(){

  const [a,b] =
    range();

  if(PERIOD === 'all')
    return `
      Todo el histórico
      <br>
      ${dateFmt(a)} – ${dateFmt(b)}
    `;

  if(PERIOD === 'current')
    return `
      Mes actual
      <br>
      ${dateFmt(a)} – ${dateFmt(b)}
    `;

  if(PERIOD === '30')
    return `
      Últimos 30 días
      <br>
      ${dateFmt(a)} – ${dateFmt(b)}
    `;

  if(PERIOD === '90')
    return `
      Últimos 90 días
      <br>
      ${dateFmt(a)} – ${dateFmt(b)}
    `;

  return `
    ${monthName(PERIOD)}
    <br>
    ${dateFmt(a)} – ${dateFmt(b)}
  `;
}
function downtime(rs){return rs.reduce((s,r)=>s+num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']),0)}
function group(rs,key,value){let m={};rs.forEach(r=>{let k=empty(r[key])?(EMPTY[key]||'Sin información'):String(r[key]).trim();m[k]=(m[k]||0)+num(r[value])});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function downGroup(rs,key){let m={};rs.forEach(r=>{let v=num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']);if(v){let k=empty(r[key])?(EMPTY[key]||'Sin información'):String(r[key]).trim();m[k]=(m[k]||0)+v}});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(a,color,timeMode=false){let mx=a[0]?.[1]||1,tot=a.reduce((s,x)=>s+x[1],0);return `<div class="bars">${a.map(([k,v])=>`<div class="bar"><div>${esc(k)}</div><div class="val">${timeMode?time(v):fmt(v)} · ${tot?(v/tot*100).toFixed(1):0}%</div><div class="track"><div class="fill" style="width:${v/mx*100}%;background:${color}"></div></div></div>`).join('')||'<div class="empty">0</div>'}</div>`}
function machines(rs){let m={};rs.forEach(r=>{let v=num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']);if(!v)return;let ma=empty(r['NO. MAQUINA'])?'Sin máquina':r['NO. MAQUINA'],mo=empty(r.MOTIVO)?'Sin motivo':r.MOTIVO;m[ma]??={t:0,r:{}};m[ma].t+=v;m[ma].r[mo]=(m[ma].r[mo]||0)+v});return Object.entries(m).sort((a,b)=>b[1].t-a[1].t).slice(0,6).map(([ma,o])=>{let [mo,v]=Object.entries(o.r).sort((a,b)=>b[1]-a[1])[0];return `<div class="machine"><strong>${esc(ma)}</strong><div class="total">${time(o.t)}</div><div class="reason">Principal motivo<b>${esc(mo)} · ${(v/o.t*100).toFixed(1)}%</b></div></div>`}).join('')||'<div class="empty">Sin tiempo muerto por máquina</div>'}
function general(){PAGE='General';nav();let s=DEPTS.map(d=>{let r=rows(d),c=CFG[d];return {d,r,c,total:sum(r,c.value),down:downtime(r)}}),prod=[...s].sort((a,b)=>b.total-a.total),dw=[...s].sort((a,b)=>b.down-a.down),td=s.reduce((z,x)=>z+x.down,0),all=s.flatMap(x=>x.r);document.querySelector('#view').innerHTML=`<header class="top"><div><h1 class="title">Dashboard de Producción</h1><div class="desc">Consulta la información de producción por área.</div></div>${periodTools()}</header><section class="panel"><h2 class="sectionTitle">Áreas de producción</h2><div class="areas">${s.map(x=>`<article class="card area" style="--accent:${x.c.accent}" onclick="show('${x.d}')"><b>${x.c.title.toUpperCase()}</b><div class="value">${fmt(x.total)}</div><div class="note">${fmt(x.r.length)} registros del período</div></article>`).join('')}</div></section><section class="executive"><article class="exec card"><div class="klabel">Mayor producción</div><div class="value">${fmt(prod[0].total)}</div><small>${prod[0].c.title}</small></article><article class="exec card"><div class="klabel">Tiempo muerto total</div><div class="value">${time(td)}</div><small>Áreas con registro</small></article><article class="exec card"><div class="klabel">Mayor tiempo muerto</div><div class="value">${time(dw[0].down)}</div><small>${dw[0].c.title}</small></article><article class="exec card"><div class="klabel">Áreas activas</div><div class="value">${s.filter(x=>x.r.length).length}</div><small>Con registros</small></article></section><div class="charts"><section class="panel"><h2 class="sectionTitle">Producción total por área (piezas)</h2>${bars(prod.map(x=>[x.c.title,x.total]),'#08776b')}</section><section class="panel"><h2 class="sectionTitle">Tiempo muerto por área</h2>${bars(dw.map(x=>[x.c.title,x.down]),'#08776b',true)}</section><section class="panel"><h2 class="sectionTitle">Principales motivos de tiempo muerto</h2>${bars(downGroup(all,'MOTIVO'),'#08776b',true)}</section><section class="panel"><h2 class="sectionTitle">Máquinas con mayor incidencia</h2><div class="machineGrid">${machines(all)}</div></section></div>`}
function state(d){

  let [a,b] = range();

  if(
    !STATE[d]
    ||
    STATE[d].period !== PERIOD
  ){

    STATE[d] = {

      period : PERIOD,

      a,

      b,

      key : '',

      val : ''

    };

  }

  return STATE[d];

}
function filtered(d){let st=state(d);return (DATA[d]||[]).filter(r=>{let k=dateKey(r.FECHA),ok=k>=st.a&&k<=st.b;if(st.key&&st.val)ok=ok&&(st.val==='__EMPTY__'?empty(r[st.key]):String(r[st.key])===st.val);return ok})}
function filterUI(d){let c=CFG[d],st=state(d),base=DATA[d]||[],vals=st.key?[...new Set(base.filter(r=>!empty(r[st.key])).map(r=>String(r[st.key])))].sort():[],has=st.key&&base.some(r=>empty(r[st.key]));return `<div class="panel filters"><div class="field"><label>Desde</label><input type="date" value="${st.a}" onchange="STATE['${d}'].a=this.value;area('${d}')"></div><div class="field"><label>Hasta</label><input type="date" value="${st.b}" onchange="STATE['${d}'].b=this.value;area('${d}')"></div><div class="field"><label>Filtrar por</label><select onchange="STATE['${d}'].key=this.value;STATE['${d}'].val='';area('${d}')"><option value="">Sin filtro adicional</option>${c.groups.map(k=>`<option value="${k}" ${st.key===k?'selected':''}>${LABEL[k]}</option>`).join('')}</select></div><div class="field"><label>Selección</label><select ${st.key?'':'disabled'} onchange="STATE['${d}'].val=this.value;area('${d}')"><option value="">Todos</option>${vals.map(v=>`<option ${st.val===v?'selected':''}>${esc(v)}</option>`).join('')}${has?`<option value="__EMPTY__" ${st.val==='__EMPTY__'?'selected':''}>${EMPTY[st.key]}</option>`:''}</select></div><button class="btn" onclick="delete STATE['${d}'];area('${d}')">Restablecer</button><button class="btn" onclick="pdfArea('${d}')">Exportar PDF</button></div>`}
function unique(rs,k){return new Set(rs.map(r=>r[k]).filter(v=>!empty(v))).size}
function trend(
  rs,
  key,
  id,
  color
){

  let m = {};

  rs.forEach(r => {

    const fecha = dateKey(r.FECHA);

    if(!fecha) return;

    m[fecha] =
      (m[fecha] || 0)
      + num(r[key]);

  });

  const points =
    Object.entries(m).sort();

  if(CHART){
    CHART.destroy();
    CHART = null;
  }

  const canvas =
    document.getElementById(id);

  if(!canvas){
    console.warn(
      'Canvas no encontrado:',
      id
    );
    return;
  }

  if(!points.length){
    return;
  }

  CHART =
    new Chart(
      canvas.getContext('2d'),
      {
        type:'line',

        data:{
          labels:
            points.map(
              p => dateFmt(p[0])
            ),

          datasets:[
            {
              data:
                points.map(
                  p => p[1]
                ),

              borderColor:
                color,

              backgroundColor:
                color + '20',

              fill:true,

              tension:0.3,

              pointRadius:2,

              borderWidth:2
            }
          ]
        },

        options:{
          responsive:true,

          maintainAspectRatio:false,

          plugins:{
            legend:{
              display:false
            }
          },

          scales:{
            y:{
              beginAtZero:true
            }
          }
        }

      }
    );

}
function kpi(l,v,a){return `<div class="kpi" style="--accent:${a}"><div class="klabel">${l}</div><div class="value">${typeof v==='string'?v:fmt(v)}</div></div>`}
function table(d,rs){let cols=Object.keys(DATA[d]?.[0]||{}).filter(k=>k&&k!=='Visible'&&k!=='Registro visible').slice(0,16);if(d==='Lavanderia'){cols=cols.filter(x=>x!=='DURACIÓN');let i=cols.indexOf('HORA DE TERMINADO');cols.splice(i+1,0,'DURACIÓN')}let head=k=>k==='HORA DE COMIENZO'?'Hora inicio':k==='HORA DE TERMINADO'?'Hora fin':k==='DURACIÓN'?'Duración':/NOTAS?/i.test(k)?'Comentarios':k;return `<div class="tableWrap"><table class="table"><thead><tr>${cols.map(k=>`<th>${head(k)}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${cols.map(k=>{let v=k==='DURACIÓN'?duration(r['HORA DE COMIENZO'],r['HORA DE TERMINADO']):r[k];if(k==='FECHA')v=dateFmt(v);if(/HORA DE (COMIENZO|TERMINADO)/.test(k))v=hour(v);let n=typeof v==='number'&&!IDS.has(k);return `<td class="${n?'num':''}">${n?fmt(v):esc(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function hour(v){let m=String(v||'').match(/(?:T|^)(\d{1,2}):(\d{2})/);return m?`${m[1].padStart(2,'0')}:${m[2]}`:'—'}function duration(a,b){a=hour(a);b=hour(b);if(a==='—'||b==='—')return '—';let [h,m]=a.split(':').map(Number),[x,y]=b.split(':').map(Number),z=x*60+y-h*60-m;if(z<0)z+=1440;return `${Math.floor(z/60)?Math.floor(z/60)+'h ':''}${z%60}m`}
function laundryType(r){return /lienzo|tela/i.test(String(r['TIPO DE PRENDA']||''))?'Lienzos':'Prendas'}
function stack(rs,key){let m={};rs.forEach(r=>{let k=key==='FECHA'?dateFmt(r.FECHA):(empty(r[key])?(EMPTY[key]||'Sin información'):r[key]),t=laundryType(r);m[k]??={Lienzos:0,Prendas:0};m[k][t]+=num(r['TOTAL KGS'])});let a=Object.entries(m).sort((x,y)=>(y[1].Lienzos+y[1].Prendas)-(x[1].Lienzos+x[1].Prendas)),mx=Math.max(1,...a.map(x=>x[1].Lienzos+x[1].Prendas));return `<div class="legend"><i class="sw" style="background:#08776b"></i>Lienzos<i class="sw" style="background:#b8da45"></i>Prendas</div><div class="bars">${a.map(([k,o])=>`<div class="bar"><div>${esc(k)}</div><div class="val">${fmt(o.Lienzos+o.Prendas)} kg</div><div class="track" style="display:flex"><div class="fill" style="width:${o.Lienzos/mx*100}%;background:#08776b"></div><div class="fill" style="width:${o.Prendas/mx*100}%;background:#b8da45"></div></div></div>`).join('')}</div>`}
function area(d){PAGE=d;nav();let c=CFG[d],r=filtered(d),total=sum(r,c.value),down=downtime(r),fourth=d==='Ejemplos'?['Tiendas',unique(r,'TIENDA')]:d==='Neck'?['Máquinas activas',unique(r,'NO. MAQUINA')]:d==='Cuadros'?['Departamentos',unique(r,'DEPT')]:[c.down?'Tiempo muerto':'Días con actividad',c.down?time(down):unique(r,'FECHA')],second=d==='Lavanderia'?['Total KGS',sum(r,'TOTAL KGS')]:d==='Cuadros'?['Procesos',unique(r,'PROCESO')]:d==='Ejemplos'?['Clientes',unique(r,'CLIENTE')]:['WO contabilizadas',unique(r,'NO. WO')];document.querySelector('#view').innerHTML=`<header class="top"><div><h1 class="title">${c.title}</h1><div class="desc">Detalle operativo del período seleccionado.</div></div><div class="periodInfo"><b>Período activo</b>${periodText()}<br>${dateFmt(state(d).a)} – ${dateFmt(state(d).b)}</div></header>${filterUI(d)}<div class="kpis">${kpi(c.metric,total,c.accent)}${kpi(second[0],second[1],c.accent)}${kpi('Registros del período',r.length,c.accent)}${kpi(fourth[0],fourth[1],c.accent)}</div><section class="panel"><h2 class="sectionTitle">${d==='Lavanderia'?'Piezas':'Producción'} por fecha</h2><div class="chart"><canvas id="trend"></canvas></div></section>${d==='Lavanderia'?`<div class="two"><section class="panel"><h2 class="sectionTitle">Kilos por fecha (lienzos / prendas)</h2>${stack(r,'FECHA')}</section><section class="panel"><h2 class="sectionTitle">Kilos por máquina (lienzos / prendas)</h2>${stack(r,'NO. MAQUINA')}</section><section class="panel"><h2 class="sectionTitle">Kilos por proceso (lienzos / prendas)</h2>${stack(r,'TIPO DE PROCESO')}</section><section class="panel"><h2 class="sectionTitle">Detalle por color</h2>${bars(group(r,'COLOR','TOTAL KGS'),c.accent)}</section></div>`:c.groups.map(k=>`<section class="panel"><h2 class="sectionTitle">Detalle por ${LABEL[k]}</h2>${bars(group(r,k,c.value),c.accent)}</section>`).join('')}${c.down?`<section class="panel"><h2 class="sectionTitle">Tiempo muerto por motivo</h2>${bars(downGroup(r,'MOTIVO'),c.accent,true)}</section><section class="panel"><h2 class="sectionTitle">Tiempo muerto por máquina</h2>${bars(downGroup(r,'NO. MAQUINA'),c.accent,true)}</section>`:''}<section class="panel"><h2 class="sectionTitle">Registros</h2>${table(d,r)}</section>`;trend(r,c.value,'trend',c.accent)}
function show(d){d==='General'?general():area(d)}
function pdfArea(d){alert('La siguiente iteración implementará el PDF del área después de validar la pantalla clean.')}
function pdfGeneral(){

  if(!window.jspdf){
    alert('No se pudo cargar jsPDF');
    return;
  }

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF({
    orientation:'landscape',
    unit:'mm',
    format:'a4'
  });

  const W = 297;
  const H = 210;

  const GREEN = [15,110,99];
  const LIME  = [184,218,69];
  const INK   = [23,59,53];

  const [from,to] = range();

  const period =
    `${dateFmt(from)} - ${dateFmt(to)}`;

  const stats =
    DEPTS.map(d=>{

      let rs = rows(d);
      let c  = CFG[d];

      return {

        area  : c.title,

        total : sum(rs,c.value),

        down  : downtime(rs),

        rows  : rs.length

      };

    });

  const prod =
    [...stats]
      .sort((a,b)=>b.total-a.total);

  const dead =
    [...stats]
      .sort((a,b)=>b.down-a.down);

  const totalDown =
    stats.reduce(
      (a,x)=>a+x.down,
      0
    );

  function footer(){

    pdf.setDrawColor(220);

    pdf.line(
      10,
      198,
      287,
      198
    );

    pdf.setFontSize(7);

    pdf.setTextColor(110);

    pdf.text(
      'JV International Solutions Inc.',
      10,
      203
    );

    pdf.text(
      new Date().toLocaleString('es-MX'),
      230,
      203
    );

  }

  function header(title,page,total){

    pdf.setTextColor(...INK);

    pdf.setFontSize(18);

    pdf.setFont(
      'helvetica',
      'bold'
    );

    pdf.text(
      'JV INTERNATIONAL',
      12,
      14
    );

    pdf.setFontSize(8);

    pdf.text(
      'SOLUTIONS INC.',
      12,
      19
    );

    pdf.setFontSize(16);

    pdf.text(
      title,
      12,
      31
    );

    pdf.setFontSize(8);

    pdf.text(
      'Período: ' + period,
      12,
      37
    );

    pdf.text(
      `Página ${page} de ${total}`,
      255,
      12
    );

  }

  function card(
    x,
    y,
    w,
    title,
    value,
    subtitle=''
  ){

    pdf.setFillColor(
      247,
      250,
      249
    );

    pdf.setDrawColor(
      ...GREEN
    );

    pdf.roundedRect(
      x,
      y,
      w,
      24,
      2,
      2,
      'FD'
    );

    pdf.setFontSize(7);

    pdf.setTextColor(90);

    pdf.text(
      title.toUpperCase(),
      x+4,
      y+6
    );

    pdf.setTextColor(
      ...INK
    );

    pdf.setFont(
      'helvetica',
      'bold'
    );

    pdf.setFontSize(13);

    pdf.text(
      String(value),
      x+4,
      y+15
    );

    pdf.setFont(
      'helvetica',
      'normal'
    );

    pdf.setFontSize(7);

    pdf.text(
      String(subtitle),
      x+4,
      y+21
    );

  }

  function bars(
    title,
    list,
    x,
    y,
    w,
    h,
    timeMode=false
  ){

    pdf.setTextColor(
      ...INK
    );

    pdf.setFont(
      'helvetica',
      'bold'
    );

    pdf.setFontSize(10);

    pdf.text(
      title,
      x,
      y
    );

    let max =
      list[0]?.[1] || 1;

    list
      .slice(0,8)
      .forEach((row,i)=>{

        const yy =
          y+10+i*10;

        pdf.setFontSize(7);

        pdf.setFont(
          'helvetica',
          'normal'
        );

        pdf.text(
          row[0],
          x,
          yy
        );

        pdf.setFillColor(
          230,
          237,
          235
        );

        pdf.rect(
          x+42,
          yy-3,
          w-75,
          3,
          'F'
        );

        pdf.setFillColor(
          ...GREEN
        );

        pdf.rect(
          x+42,
          yy-3,
          ((w-75)*row[1])/max,
          3,
          'F'
        );

        pdf.text(
          timeMode
            ? time(row[1])
            : fmt(row[1]),
          x+w-28,
          yy
        );

      });

  }

  /* --------------------------------
     PAGINA 1
  -------------------------------- */

  header(
    'Informe General de Producción',
    1,
    2
  );

  card(
    10,
    45,
    65,
    'Mayor producción',
    fmt(prod[0]?.total || 0),
    prod[0]?.area || ''
  );

  card(
    80,
    45,
    65,
    'Tiempo muerto total',
    time(totalDown)
  );

  card(
    150,
    45,
    65,
    'Mayor tiempo muerto',
    time(dead[0]?.down || 0),
    dead[0]?.area || ''
  );

  card(
    220,
    45,
    65,
    'Áreas activas',
    stats.filter(
      x=>x.rows
    ).length
  );

  bars(
    'Producción total por área',
    prod.map(
      x=>[
        x.area,
        x.total
      ]
    ),
    10,
    85,
    276,
    60
  );

  bars(
    'Tiempo muerto por área',
    dead.map(
      x=>[
        x.area,
        x.down
      ]
    ),
    10,
    150,
    276,
    40,
    true
  );

  footer();

  /* --------------------------------
     PAGINA 2
  -------------------------------- */

  pdf.addPage();

  header(
    'Informe General de Producción',
    2,
    2
  );

  let all =
    DEPTS.flatMap(
      d=>rows(d)
    );

  let motivos =
    downGroup(
      all,
      'MOTIVO'
    );

  let maquinas =
    downGroup(
      all,
      'NO. MAQUINA'
    );

  bars(
    'Principales motivos de tiempo muerto',
    motivos,
    10,
    50,
    133,
    100,
    true
  );

  bars(
    'Máquinas con mayor incidencia',
    maquinas,
    150,
    50,
    133,
    100,
    true
  );

  let lav =
    rows('Lavanderia');

  const totalKg =
    sum(
      lav,
      'TOTAL KGS'
    );

  let lienzos=0;
  let prendas=0;

  lav.forEach(r=>{

    let kg =
      num(
        r['TOTAL KGS']
      );

    if(
      laundryType(r)
      === 'Lienzos'
    ){
      lienzos += kg;
    }else{
      prendas += kg;
    }

  });

  card(
    10,
    160,
    60,
    'Total KG',
    fmt(totalKg)
  );

  card(
    75,
    160,
    60,
    'Lienzos',
    fmt(lienzos),
    totalKg
      ? ((lienzos/totalKg)*100)
          .toFixed(1)+'%'
      : '0%'
  );

  card(
    140,
    160,
    60,
    'Prendas',
    fmt(prendas),
    totalKg
      ? ((prendas/totalKg)*100)
          .toFixed(1)+'%'
      : '0%'
  );

  pdf.setFontSize(9);

  pdf.setTextColor(
    ...INK
  );

  pdf.text(
    `Mayor volumen procesado: ${prod[0]?.area} registró ${fmt(prod[0]?.total)} piezas durante el período.`,
    210,
    170,
    {
      maxWidth:70
    }
  );

  pdf.text(
    `Tiempo muerto total: ${time(totalDown)}.`,
    210,
    182,
    {
      maxWidth:70
    }
  );

  footer();

  pdf.save(
    `Informe_Produccion_General_${PERIOD}.pdf`
  );

}
fetch('data.json?v='+Date.now())
.then(r=>r.json())
.then(j=>{

  DATA=j;

  PERIOD =
    PERIOD || 'all';

  setTimeout(
  () => general(),
  10
);

})
.catch(e=>{

  document.querySelector(
    '#view'
  ).innerHTML =
    '<div class="panel"><b>No se pudo cargar data.json.</b></div>';

});
</script></body></html>
