<style>:root{--bg:#f3f5f4;--card:#fff;--ink:#203f39;--muted:#71807c;--line:#dfe7e4;--green:#0f6e63;--lime:#9acb3c;--side:#111820}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#25302d;font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:225px;background:var(--side);padding:18px 12px;position:sticky;top:0;height:100vh}.logo{width:195px;background:#fff;border-radius:6px}.sub{color:#8fa09b;font-size:10px;letter-spacing:.8px;margin:10px}.nav button{display:block;width:100%;border:0;background:none;color:#c8d0cd;text-align:left;padding:10px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#21302f;color:#fff}.main{flex:1;padding:25px;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}h1{margin:0;color:#17221f;font-size:27px}h3{margin:0 0 13px;font-size:15px;color:#33443f}.desc,.small{color:var(--muted);font-size:12px}.tools,.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:bold}.field input,.field select,.btn{height:37px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}.btn{background:var(--green);color:#fff;font-weight:bold;cursor:pointer}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 5px 18px #18352d0b;margin-bottom:15px}.deptgrid,.kpis,.executive{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.deptgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.dept{border-left:4px solid var(--accent);cursor:pointer}.dept b{font-size:11px}.num,.kpi .v{font:700 25px monospace;margin:8px 0}.kpi{border-left:4px solid var(--accent);margin:0}.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase}.executive .card{margin:0}.executive b{display:block;font:700 19px monospace;margin:8px 0}.bars{dis function allDates(){return DEPTS.flatMap(d=>rows(d).map(r=>dk(r.FECHA)).filter(Boolean)).sort()}function range(){let a=allDates(),end=a.at(-1)||'';if(period==='all')return[a[0]||'',end];let[y,m]=period.split('-').map(Number);return[`${y}-${String(m).padStart(2,'0')}-01`,new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)]}function inPeriod(r){let[a,b]=range(),k=dk(r.FECHA);return(!a||k>=a)&&(!b||k<=b)}function months(){return[...new Set(allDates().map(x=>x.slice(0,7)))].sort().reverse()}function pLabel(x){if(x==='all')return'Todo el histórico';let[y,m]=x.split('-');return new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${y}-${m}-01T00:00:00Z`))}function periodSelect(){return `<div class="field"><label>Período activo</label><select onchange="period=this.value;localStorage.setItem('period',period);states={};show('General')"><option value="all">Todo el histórico</option>${months().map(x=>`<option value="${x}" ${period===x?'selected':''}>${pLabel(x)}</option>`).join('')}</select></div>`}
