<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JV International — Dashboard de Producción</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#173b35;--muted:#687873;--line:#dfe8e5;--side:#101a20;--green:#08776b;--lime:#b8da45;--shadow:0 5px 18px #153b3220;--r:13px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#192622;font-family:Inter,Segoe UI,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:var(--side);padding:22px 16px;position:sticky;top:0;height:100vh}.logoBox{display:flex;justify-content:center;align-items:center;padding:6px 0 18px}.logoBox img{max-width:170px;max-height:72px;width:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}.sideLabel{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9cb5af;padding:12px 12px 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}.side button{display:block;width:100%;border:none;background:transparent;color:#e7f1ef;font-size:14px;font-weight:600;padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer;transition:.2s}.side button:hover,.side button.active{background:rgba(255,255,255,.08)}.main{flex:1;padding:20px 22px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.title{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-.04em}.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field select,.field input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:13px}.periodInfo{font-size:12px;color:var(--muted);line-height:1.45;background:rgba(8,119,107,.05);padding:10px 12px;border:1px solid rgba(8,119,107,.12);border-radius:10px}.btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.summary{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:16px}.kpi{background:linear-gradient(180deg,#fff,#f7faf9);border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 14px;border-radius:14px}.klabel{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.value{margin-top:8px;font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.04em}.areas,.executive,.kpis,.machineGrid,.two{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:16px}.sectionTitle{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}.map{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.row:last-child{border-bottom:none}.muted{color:var(--muted)}.bars{display:flex;flex-direction:column;gap:6px}.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:12px;color:var(--ink)}.bar .track{height:10px;background:#ecf2ef;border-radius:10px;overflow:hidden}.bar .fill{height:100%;border-radius:10px}.tableWrap{overflow:auto;max-height:440px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-weight:800;background:#f7faf9;position:sticky;top:0}.small{font-size:12px;color:var(--muted)}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}.filter{display:flex;flex-direction:column;gap:6px}.filter select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px}.chart{height:220px}.footerNote{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;padding-top:12px}.gh{font-size:11px;color:var(--muted)}@media(max-width:950px){.side{width:185px}.main{width:calc(100% - 185px)}.areas,.executive,.kpis,.machineGrid,.two,.summary,.filters{grid-template-columns:1fr 1fr}.bar{grid-template-columns:1fr}.title{font-size:24px}.topbar{flex-direction:column;align-items:flex-start}}@media(max-width:680px){.app{flex-direction:column}.side{position:relative;height:auto;width:100%}.main{width:100%;padding:14px}.summary,.areas,.executive,.kpis,.machineGrid,.two,.filters{grid-template-columns:1fr}.bar{grid-template-columns:1fr}.topbar{margin-bottom:10px}};
</style></head><body><div class="app"><aside class="side"><div class="logoBox"><img src="Logo_JV International.png" alt="JV International Solutions Inc."></div><div class="sideLabel">DASHBOARD DE PRODUCCIÓN</div><div id="nav"></div></aside><div class="main"><div class="topbar"><div class="title">Dashboard</div><div id="tools"></div></div><div id="view"></div></div></div><script>
'use strict';
let DATA={},PAGE='General',PERIOD=localStorage.getItem('jvPeriod')||'',CUSTOM_FROM=localStorage.getItem('jvCustomFrom')||'',CUSTOM_TO=localStorage.getItem('jvCustomTo')||'',STATE={},CHART=null;
const CFG={
  Estampado:{title:'Estampado',value:'TOTAL',metric:'Piezas trabajadas',accent:'#08776b',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE HIT','ESPECIALIDAD'],down:true},
  Neck:{title:'Neck',value:'TOTAL',metric:'Total de piezas',accent:'#3c6e8f',groups:['NO. MAQUINA','TIPO DE PRENDA']},
  Cuadros:{title:'Cuadros',value:'CANT. CUADROS',metric:'Total de cuadros',accent:'#4a55a8',groups:['PROCESO','ESPECIALIDAD','DEPT']},
  Empaque:{title:'Empaque',value:'TOTAL',metric:'Total de piezas',accent:'#c9762f',groups:['TIPO DE EMPAQUE','TIPO DE PRENDA'],down:true},
  Ejemplos:{title:'Ejemplos',value:'PRENDAS',metric:'Prendas',accent:'#8a5cb0',groups:['DEPTO','CLIENTE','TIENDA','ESPECIALIDAD','TIPO DE HIT']},
  Lavanderia:{title:'Lavandería',value:'CANTIDAD DE PIEZAS',metric:'Cantidad de piezas',accent:'#3f7d3a',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE PROCESO','COLOR'],down:true}
};
const DEPTS=Object.keys(CFG),LABEL={'NO. MAQUINA':'Máquina','TIPO DE PRENDA':'Tipo de prenda','TIPO DE HIT':'Tipo de hit',ESPECIALIDAD:'Especialidad',MOTIVO:'Motivo',PROCESO:'Proceso',DEPT:'Departamento',CLIENTE:'Cliente',TIENDA:'Tienda',DEPTO:'Depto',COLOR:'Color'};
const EMPTY={'NO. MAQUINA':'Sin máquina','TIPO DE PRENDA':'Sin tipo de prenda','TIPO DE HIT':'Sin tipo de hit',ESPECIALIDAD:'Sin especialidad',MOTIVO:'Sin motivo',PROCESO:'Sin proceso',DEPT:'Sin departamento',CLIENTE:'Sin cliente',TIENDA:'Sin tienda',DEPTO:'Sin depto',COLOR:'Sin color'};
const IDS=new Set(['FOLIO','NO. WO','ESTILO','NO. MAQUINA','NO. FOLDER']);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])), num=v=>Number.isFinite(Number(v))?Number(v):0, fmt=v=>new Intl.NumberFormat('es-MX').format(Number(v)||0), dateKey=v=>{if(!v)return'';const s=String(v).trim();if(!s)return'';const d=new Date(s);if(Number.isNaN(d.getTime()))return'';return d.toISOString().slice(0,10)}, dateFmt=d=>{const x=new Date(`${d}T00:00:00Z`);return new Intl.DateTimeFormat('es-MX',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}).format(x)}, sum=(rs,k)=> (rs||[]).reduce((s,r)=>s+num(r[k]),0), empty=v=> String(v??'').trim() === '';
function periodMonths(){const months=new Set();DEPTS.forEach(dept=>{(DATA[dept]||[]).forEach(r=>{const fecha=dateKey(r.FECHA);if(!fecha)return;months.add(fecha.slice(0,7));});});return [...months].sort().reverse();}
function range(){const allDates=DEPTS.flatMap(d=>(DATA[d]||[]).map(r=>dateKey(r.FECHA)).filter(Boolean)).sort();const minDate=allDates[0], maxDate=allDates.at(-1);if(PERIOD==='custom'){const from=CUSTOM_FROM||minDate;const to=CUSTOM_TO||maxDate;return from<=to?[from,to]:[to,from];}if(PERIOD==='all')return[minDate,maxDate];if(PERIOD==='30'){let end=new Date(maxDate);let start=new Date(end);start.setDate(start.getDate()-29);return[start.toISOString().slice(0,10),maxDate];}if(PERIOD==='90'){let end=new Date(maxDate);let start=new Date(end);start.setDate(start.getDate()-89);return[start.toISOString().slice(0,10),maxDate];}if(PERIOD==='current')return[maxDate.slice(0,7)+'-01',maxDate];let [y,m]=PERIOD.split('-').map(Number);return[`${y}-${String(m).padStart(2,'0')}-01`,new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)];}
function rows(d){let [a,b]=range();return (DATA[d]||[]).filter(r=>{let k=dateKey(r.FECHA);return k>=a&&k<=b})}
function monthLabel(){if(PERIOD==='all')return'Todo el histórico';if(PERIOD==='current')return'Mes actual';if(PERIOD==='30')return'Últimos 30 días';if(PERIOD==='90')return'Últimos 90 días';let [y,m]=PERIOD.split('-');return new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${y}-${m}-01T00:00:00Z`));}
function nav(){document.querySelector('#nav').innerHTML=['General',...DEPTS].map(d=>`<button class="${PAGE===d?'active':''}" onclick="show('${d}')">${d==='Lavanderia'?'Lavandería':d}</button>`).join('');}
function setPeriod(value){PERIOD=value;localStorage.setItem('jvPeriod',PERIOD);if(PERIOD==='custom'){const [from,to]=range();CUSTOM_FROM=CUSTOM_FROM||from;CUSTOM_TO=CUSTOM_TO||to;localStorage.setItem('jvCustomFrom',CUSTOM_FROM);localStorage.setItem('jvCustomTo',CUSTOM_TO);}STATE={};setTimeout(()=>show(PAGE),10);}
function changeCustomRange(field,value){if(field==='from')CUSTOM_FROM=value;if(field==='to')CUSTOM_TO=value;if(CUSTOM_FROM&&CUSTOM_TO&&CUSTOM_FROM>CUSTOM_TO){if(field==='from')CUSTOM_TO=CUSTOM_FROM;else CUSTOM_FROM=CUSTOM_TO;}localStorage.setItem('jvCustomFrom',CUSTOM_FROM);localStorage.setItem('jvCustomTo',CUSTOM_TO);STATE={};setTimeout(()=>show(PAGE),10);}
function periodTools(){const [from,to]=range();return `<div class="tools"><div class="field"><label>Período activo</label><select onchange="setPeriod(this.value)"><option value="all" ${PERIOD==='all'?'selected':''}>Todo el histórico</option><option value="custom" ${PERIOD==='custom'?'selected':''}>Rango personalizado</option>${periodMonths().map(m=>`<option value="${m}" ${m===PERIOD?'selected':''}>${monthName(m)}</option>`).join('')}</select></div>${PERIOD==='custom'?`<div class="field"><label>Desde</label><input type="date" value="${from||''}" onchange="changeCustomRange('from',this.value)"></div><div class="field"><label>Hasta</label><input type="date" value="${to||''}" onchange="changeCustomRange('to',this.value)"></div>`:''}<div class="periodInfo"><b>${PERIOD==='custom'?'Rango de fechas':'Período activo'}</b>${periodText()}</div><button class="btn" onclick="pdfGeneral()">Exportar PDF</button></div>`;}
function monthName(m){let [y,x]=m.split('-');return new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${y}-${x}-01T00:00:00Z`))}
function periodText(){const [a,b]=range();if(PERIOD==='custom')return`<br>${dateFmt(a)} – ${dateFmt(b)}`;if(PERIOD==='all')return`<br>Todo el histórico<br>${dateFmt(a)} – ${dateFmt(b)}`;if(PERIOD==='current')return`<br>Mes actual<br>${dateFmt(a)} – ${dateFmt(b)}`;if(PERIOD==='30')return`<br>Últimos 30 días<br>${dateFmt(a)} – ${dateFmt(b)}`;if(PERIOD==='90')return`<br>Últimos 90 días<br>${dateFmt(a)} – ${dateFmt(b)}`;return`<br>${monthName(PERIOD)}<br>${dateFmt(a)} – ${dateFmt(b)}`;}
function downtime(rs){return rs.reduce((s,r)=>s+num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']),0)}
function group(rs,key,value){let m={};rs.forEach(r=>{let k=empty(r[key])?(EMPTY[key]||'Sin información'):String(r[key]).trim();m[k]=(m[k]||0)+num(r[value])});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function downGroup(rs,key){let m={};rs.forEach(r=>{let v=num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']);if(v){let k=empty(r[key])?(EMPTY[key]||'Sin información'):String(r[key]).trim();m[k]=(m[k]||0)+v;}});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function bars(a,color,timeMode=false){let mx=a[0]?.[1]||1,tot=a.reduce((s,x)=>s+x[1],0);return `<div class="bars">${a.map(([k,v])=>`<div class="bar"><div>${esc(k)}</div><div class="track"><div class="fill" style="width:${Math.max(4, (v/mx)*100)}%;background:${color};"></div></div><div class="small">${timeMode?time(v):fmt(v)}</div></div>`).join('')}</div>`;}
function machines(rs){let m={};rs.forEach(r=>{let v=num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']);if(!v)return;let ma=empty(r['NO. MAQUINA'])?'Sin máquina':r['NO. MAQUINA'],mo=empty(r.MOTIVO)?'Sin motivo':r.MOTIVO;m[ma]??={total:0,by:{}};m[ma].total+=v;m[ma].by[mo]=(m[ma].by[mo]||0)+v;});return Object.entries(m).sort((a,b)=>b[1].total-a[1].total);}
function general(){PAGE='General';nav();let s=DEPTS.map(d=>{let r=rows(d),c=CFG[d];return {d,r,c,total:sum(r,c.value),down:downtime(r)}}),prod=[...s].sort((a,b)=>b.total-a.total);dw=[...s].sort((a,b)=>b.down-a.down);const active=s.filter(x=>x.r.length).length;document.querySelector('#tools').innerHTML=periodTools();document.querySelector('#view').innerHTML=`<div class="summary">${['Mayor producción','Tiempo muerto total','Mayor tiempo muerto','Áreas activas'].map((label,i)=>`<div class="kpi" style="--accent:${['#08776b','#c9762f','#b04d4d','#4a55a8'][i]}"><div class="klabel">${label}</div><div class="value">${i===0?fmt(prod[0]?.total||0):i===1?time(s.reduce((a,x)=>a+x.down,0)):i===2?time(dw[0]?.down||0):String(active)}</div></div>`).join('')}</div><div class="panel"><div class="sectionTitle">Resumen por área</div><div class="areas">${s.map(x=>`<div class="panel"><div class="row"><strong>${x.c.title}</strong><span class="muted">${fmt(x.total)}</span></div><div class="row"><span class="muted">Tiempo muerto</span><span>${time(x.down)}</span></div><div class="row"><span class="muted">Registros</span><span>${x.r.length}</span></div></div>`).join('')}</div></div>`;}
function state(d){let [a,b]=range();if(!STATE[d]||STATE[d].period!==PERIOD){STATE[d]={period:PERIOD,a,b,key:'',val:''}};return STATE[d];}
function filtered(d){let st=state(d);return (DATA[d]||[]).filter(r=>{let k=dateKey(r.FECHA),ok=k>=st.a&&k<=st.b;if(st.key&&st.val)ok=ok&&(st.val==='__EMPTY__'?empty(r[st.key]):String(r[st.key])==String(st.val));return ok;});}
function filterUI(d){let c=CFG[d],st=state(d),base=DATA[d]||[],vals=st.key?[...new Set(base.filter(r=>!empty(r[st.key])).map(r=>String(r[st.key])))].sort():[],has=st.key&&base.some(r=>empty(r[st.key]));return `<div class="filter"><label>${LABEL[st.key]||'Filtro'}</label><select onchange="STATE['${d}'].key='${st.key}';STATE['${d}'].val=this.value;show('${d}')"><option value="">Todos</option>${has?`<option value="__EMPTY__" ${st.val==='__EMPTY__'?'selected':''}>${EMPTY[st.key]||'Sin información'}</option>`:''}${vals.map(v=>`<option value="${esc(v)}" ${String(st.val)===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;}
function unique(rs,k){return new Set(rs.map(r=>r[k]).filter(v=>!empty(v))).size}
function trend(rs,key,id,color){let m={};rs.forEach(r=>{const fecha=dateKey(r.FECHA);if(!fecha)return;m[fecha]=(m[fecha]||0)+num(r[key]);});const points=Object.entries(m).sort();if(CHART){CHART.destroy();CHART=null;}const canvas=document.getElementById(id);if(!canvas){console.warn('Canvas no encontrado:',id);return;}if(!points.length)return;CHART=new Chart(canvas.getContext('2d'),{type:'line',data:{labels:points.map(p=>dateFmt(p[0])),datasets:[{data:points.map(p=>p[1]),borderColor:color,backgroundColor:color+'20',fill:true,tension:0.3,pointRadius:2,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}
function kpi(l,v,a){return `<div class="kpi" style="--accent:${a}"><div class="klabel">${l}</div><div class="value">${typeof v==='string'?v:fmt(v)}</div></div>`}
function table(d,rs){let cols=Object.keys(DATA[d]?.[0]||{}).filter(k=>k&&k!=='Visible'&&k!=='Registro visible').slice(0,16);if(d==='Lavanderia'){cols=cols.filter(x=>x!=='DURACIÓN');let i=cols.indexOf('TOTAL KGS');if(i>=0)cols.splice(i,1);}return `<div class="tableWrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rs.slice(0,20).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function hour(v){let m=String(v||'').match(/(?:T|^)(\d{1,2}):(\d{2})/);return m?`${m[1].padStart(2,'0')}:${m[2]}`:'—'}function duration(a,b){a=hour(a);b=hour(b);if(a==='—'||b==='—')return '—';const [ha,ma]=a.split(':').map(Number),[hb,mb]=b.split(':').map(Number);return `${String(Math.abs((hb*60+mb)-(ha*60+ma))).padStart(2,'0')} min`;}
function laundryType(r){return /lienzo|tela/i.test(String(r['TIPO DE PRENDA']||''))?'Lienzos':'Prendas'}
function stack(rs,key){let m={};rs.forEach(r=>{let k=key==='FECHA'?dateFmt(r.FECHA):(empty(r[key])?(EMPTY[key]||'Sin información'):r[key]),t=laundryType(r);m[k]??={Lienzos:0,Prendas:0};m[k][t]+=num(r['CANTIDAD DE PIEZAS']||r['TOTAL KGS']||r['TOTAL']);});return Object.entries(m).map(([label,v])=>[label,v.Lienzos||0,v.Prendas||0]);}
function area(d){PAGE=d;nav();const c=CFG[d],r=filtered(d),total=sum(r,c.value),down=downtime(r),fourth=d==='Ejemplos'?['Tiendas',unique(r,'TIENDA')]:d==='Neck'?['Máquinas activas',unique(r,'NO. MAQUINA')]:d==='Cuadros'?['Departamentos',unique(r,'DEPT')]:[c.down?'Tiempo muerto':'Días con actividad',c.down?time(down):unique(r,'FECHA')],second=d==='Lavanderia'?['Total KGS',sum(r,'TOTAL KGS')]:d==='Cuadros'?['Procesos',unique(r,'PROCESO')]:d==='Ejemplos'?['Clientes',unique(r,'CLIENTE')]:['WO contabilizadas',unique(r,'NO. WO')];document.querySelector('#tools').innerHTML=periodTools();document.querySelector('#view').innerHTML=`<div class="summary">${kpi(c.metric, total, c.accent)}${kpi(second[0], typeof second[1]==='string'?second[1]:fmt(second[1]), c.accent)}${kpi('Registros', r.length, c.accent)}${kpi(fourth[0], typeof fourth[1]==='string'?fourth[1]:fmt(fourth[1]), c.accent)}</div><div class="panel"><div class="sectionTitle">${c.title}</div><div class="map">${(c.groups||[]).slice(0,2).map((g,i)=>`<div><div class="small">${LABEL[g]||g}</div>${bars(group(r,g,c.value).slice(0,6), c.accent)}</div>`).join('')}<div><div class="small">Detalle</div>${bars(downGroup(r,'MOTIVO').slice(0,6), '#c9762f', true)}</div></div></div>${table(d,r)}`;}
function show(d){d==='General'?general():area(d)}
fetch('https://jvinternational.github.io/Dashboard/data.json?ts='+Date.now(), {cache:'no-store'})
.then(r=>{if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();})
.then(j=>{DATA=j;const allowedPeriods = new Set(['all','custom',...periodMonths()]);PERIOD = allowedPeriods.has(PERIOD) ? PERIOD : 'all';setTimeout(()=>general(),10);})
.catch(()=>{document.querySelector('#view').innerHTML = '<div class="panel"><b>No se pudo cargar data.json.</b></div>';});
</script></body></html>
