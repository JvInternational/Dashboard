<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JV International — Dashboard de Producción 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#171b21; --muted:#6b7280; --line:#e5e7eb;
  --sidebar:#12161d; --sidebar-ink:#c9cfd8;
  --teal:#0f6e63; --amber:#c9762f; --indigo:#4a55a8; --violet:#8a5cb0; --green:#3f7d3a; --steel:#3c6e8f;
  --danger:#c1462f;
  --shadow:0 1px 2px rgba(15,23,32,.04),0 8px 24px rgba(15,23,32,.06);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--sidebar);color:var(--sidebar-ink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:17px;color:#fff;padding:4px 10px 2px;letter-spacing:.2px}
.sub{font-size:11.5px;color:#8b95a3;padding:0 10px 20px;letter-spacing:.3px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--sidebar-ink);text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;font-family:'Inter'}
.nav button .dot{width:8px;height:8px;border-radius:50%;background:#4a5468;flex:none}
.nav button:hover{background:#1c2230;color:#fff}
.nav button.active{background:#20283a;color:#fff}
.nav button.active .dot{background:var(--accent,#0f6e63)}
.main{flex:1;padding:26px 28px 60px;max-width:1440px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}
.title{font-size:26px;letter-spacing:.1px}
.desc{color:var(--muted);font-size:13.5px;margin-top:4px}
.updated{font-size:11.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:8px;white-space:nowrap}
.filters{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px}
.field label{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select{height:36px;border:1px solid #d7dbe1;border-radius:8px;padding:0 9px;background:#fff;color:var(--ink);font-family:Inter;font-size:13px}
.btn{height:36px;border:0;border-radius:8px;padding:0 14px;cursor:pointer;font-weight:600;font-size:13px}
.primary{background:var(--ink);color:#fff}
.primary:hover{background:#000}
.secondary{background:#eef0f3;color:#374151}
.secondary:hover{background:#e3e6eb}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent,var(--teal));border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:25px;font-weight:600;margin-top:6px;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1.3fr .9fr;gap:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:14.5px;margin-bottom:14px;color:#374151;font-weight:600}
.chartbox{position:relative;height:250px}
.chartbox.short{height:210px}
.bars{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow:auto}
.barrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:12.5px}
.barlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#374151;font-weight:500}
.barval{text-align:right;font-family:'IBM Plex Mono';font-weight:600;color:#111827}
.barbg{grid-column:1/-1;height:7px;background:#eef0f3;border-radius:10px;overflow:hidden}
.barfill{height:100%;border-radius:10px;background:var(--accent,var(--teal))}
.tablewrap{overflow:auto;max-height:460px;border:1px solid var(--line);border-radius:10px}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{position:sticky;top:0;background:#f8f9fb;color:#4b5563;text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;font-weight:600;cursor:pointer}
.table th:hover{color:var(--ink)}
.table th .arrow{color:var(--accent,var(--teal));margin-left:3px}
.table td{padding:8px 11px;border-bottom:1px solid #eef0f3;white-space:nowrap;color:#374151}
.table td.num{text-align:right;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums;color:#111827}
.table tbody tr:nth-child(even){background:#fafbfc}
.table tbody tr:hover td{background:#f2f6f5}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.5}
.comment-box{white-space:pre-wrap;font-size:13px;color:#374151;line-height:1.6}
.deptgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dept{cursor:pointer;transition:.15s;border-left:3px solid var(--accent,var(--teal))}
.dept:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(15,23,32,.1)}
.dept .num{font-size:24px;font-weight:600;margin-top:8px;font-family:'IBM Plex Mono'}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;background:#f0f1f4;color:#4b5563;padding:4px 8px;border-radius:99px}
.footer{margin-top:22px;font-size:11px;color:#9aa2ad}
@media(max-width:1100px){.side{width:190px}.kpis{grid-template-columns:repeat(2,1fr)}.grid,.grid2{grid-template-columns:1fr}.deptgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{display:block}.side{position:static;width:100%;height:auto}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;width:auto}.main{padding:16px}.kpis,.deptgrid{grid-template-columns:1fr}.top{display:block}.updated{display:inline-block;margin-top:10px}}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#d7dbe1;border-radius:4px}

/* v3.0 */
body.dark{--bg:#0f141b;--card:#18202b;--ink:#edf2f7;--muted:#a8b2c1;--line:#2a3442;--shadow:0 8px 28px rgba(0,0,0,.22)}
body.dark .field input,body.dark .field select{background:#111923;color:var(--ink);border-color:var(--line)}body.dark .secondary{background:#263141;color:#e5e7eb}body.dark .updated{background:var(--card)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.iconbtn{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:0 12px;cursor:pointer;font-weight:600}.searchbar{min-width:250px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--card);color:var(--ink)}
.dept{cursor:pointer;transition:.2s}.dept:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(15,23,42,.12)}.executive{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.exec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.exec b{display:block;font:600 20px 'IBM Plex Mono';margin-top:6px}.widegrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}.search-results{position:fixed;right:28px;top:72px;width:min(620px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.22);border-radius:12px;z-index:1300;padding:10px;display:none}.sr{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.sr:hover{background:var(--bg)}
@media(max-width:768px){.main{padding:16px 10px 40px}.top{flex-direction:column}.tools{width:100%;justify-content:stretch}.searchbar{min-width:0;flex:1}.deptgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.widegrid,.grid,.executive{grid-template-columns:1fr!important}.executive{grid-template-columns:repeat(2,1fr)!important}.title{font-size:22px}.chartbox{height:280px!important}.search-results{right:12px;top:120px}}
</style></head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">JV INTERNATIONAL</div>
    <div class="sub">Dashboard de producción</div>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>

<script>
let DATA={};let current='General';let sortState={};let CHARTS={};
let cfg={
'Estampado':{title:'Estampado',desc:'Producción por fecha, máquina, tipo de prenda, hit, especialidad y tiempo muerto.',metric:'Piezas trabajadas',value:'TOTAL',group:'NO. MAQUINA',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE HIT','ESPECIALIDAD','MOTIVO'],accent:'#0f6e63',hasDowntime:true},
'Neck':{title:'Neck',desc:'Producción por fecha, máquina, tipo de prenda y orden de trabajo.',metric:'Total de piezas',value:'TOTAL',group:'NO. MAQUINA',groups:['NO. MAQUINA','TIPO DE PRENDA'],accent:'#3c6e8f',hasDowntime:false},
'Cuadros':{title:'Cuadros',desc:'Cantidad de cuadros por fecha, proceso, especialidad y departamento.',metric:'Total de cuadros',value:'CANT. CUADROS',group:'PROCESO',groups:['PROCESO','ESPECIALIDAD','DEPT'],accent:'#4a55a8',hasDowntime:false},
'Empaque':{title:'Empaque',desc:'Cantidad de piezas por fecha, tipo de empaque y tipo de prenda.',metric:'Total de piezas',value:'TOTAL',group:'TIPO DE EMPAQUE',groups:['TIPO DE EMPAQUE','TIPO DE PRENDA','MOTIVO'],accent:'#c9762f',hasDowntime:true},
'Ejemplos':{title:'Ejemplos',desc:'Prendas trabajadas por departamento, cliente, tienda y especialidad.',metric:'Prendas',value:'PRENDAS',group:'DEPTO',groups:['DEPTO','CLIENTE','TIENDA','ESPECIALIDAD','TIPO DE HIT'],accent:'#8a5cb0',hasDowntime:false},
'Lavanderia':{title:'Lavandería',desc:'Producción por fecha, máquina, tipo de prenda, proceso, color y tiempo muerto.',metric:'Cantidad de piezas',value:'CANTIDAD DE PIEZAS',group:'NO. MAQUINA',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE PROCESO','COLOR','MOTIVO'],accent:'#3f7d3a',hasDowntime:true}
};
const depts=['Estampado','Neck','Cuadros','Empaque','Ejemplos','Lavanderia'];
const PALETTE=['#0f6e63','#c9762f','#4a55a8','#8a5cb0','#3f7d3a','#3c6e8f','#c1462f','#7d8597'];

/* ---------- utilidades ---------- */
function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function num(v){let n=Number(v);return Number.isFinite(n)?n:0}
function fmt(n){return new Intl.NumberFormat('es-MX',{maximumFractionDigits:0}).format(n)}
function dkey(v){return v?String(v).slice(0,10):''}
function fmtDate(v){let k=dkey(v);if(!k)return '—';let p=k.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:k}
function isNum(v){return typeof v==='number'}
function rows(dept){return DATA[dept]||[]}
function visible(dept,r){const campo=dept==='Lavanderia'?'Registro visible':'Visible';if(!(campo in r)||r[campo]==null||String(r[campo]).trim()==='')return true;return ['1','true','si','sí'].includes(String(r[campo]).trim().toLowerCase())}
function dates(rs){return rs.map(r=>dkey(r.FECHA)).filter(Boolean).sort()}
function options(rs,key){return [...new Set(rs.map(r=>r[key]).filter(v=>v!==null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'es'))}
function sum(rs,key){return rs.reduce((a,r)=>a+num(r[key]),0)}
function comentarios(dept){return (DATA.__comentarios&&DATA.__comentarios[dept])||''}
function destroyChart(id){if(CHARTS[id]){CHARTS[id].destroy();delete CHARTS[id]}}
function baseVis(dept){return rows(dept).filter(r=>visible(dept,r))}
function filtered(dept){let rs=baseVis(dept);let f=document.getElementById('fFrom')?.value||'';let t=document.getElementById('fTo')?.value||'';let d=document.getElementById('fDim')?.value||'';let val=document.getElementById('fVal')?.value||'';return rs.filter(r=>{let fk=dkey(r.FECHA);return (!f||fk>=f)&&(!t||fk<=t)&&(!d||String(r[d])===val)})}
function lastDate(){let all=depts.flatMap(d=>rows(d).map(r=>dkey(r.FECHA)).filter(Boolean));return all.length?fmtDate(all.sort().at(-1)):'—'}

/* ---------- navegación ---------- */
function nav(){
  const icons={General:'◆',Estampado:'●',Neck:'●',Cuadros:'●',Empaque:'●',Ejemplos:'●',Lavanderia:'●'};
  document.getElementById('nav').innerHTML=['General',...depts].map(d=>{
    const acc = d==='General' ? '#0f6e63' : cfg[d].accent;
    return `<button class="${current===d?'active':''}" style="--accent:${acc}" onclick="show('${d}')"><span class="dot"></span>${d==='Lavanderia'?'Lavandería':d}</button>`;
  }).join('');
}

/* ---------- filtros ---------- */
function filters(dept){
  let rs=baseVis(dept), c=cfg[dept], ds=dates(rs);
  let min=ds[0]||'',max=ds.at(-1)||'';
  let opts=c.groups.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');
  return `<div class="filters">
    <div class="field"><label>Desde</label><input id="fFrom" type="date" value="${min}" min="${min}" max="${max}" onchange="renderDept('${dept}')"></div>
    <div class="field"><label>Hasta</label><input id="fTo" type="date" value="${max}" min="${min}" max="${max}" onchange="renderDept('${dept}')"></div>
    <div class="field"><label>Filtrar por</label><select id="fDim" onchange="updateValues('${dept}')"><option value="">Todos</option>${opts}</select></div>
    <div class="field"><label>Valor</label><select id="fVal" onchange="renderDept('${dept}')"><option value="">Todos</option></select></div>
    <button class="btn secondary" onclick="resetFilters('${dept}')">Restablecer</button>
    <button class="btn primary" onclick="downloadCSV('${dept}')">Exportar CSV</button>
  </div>`;
}
function updateValues(dept){let rs=baseVis(dept),dim=document.getElementById('fDim').value,sel=document.getElementById('fVal');sel.innerHTML='<option value="">Todos</option>'+options(rs,dim).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');renderDept(dept)}
function resetFilters(dept){renderDept(dept)}

/* ---------- piezas visuales ---------- */
function kpi(label,val){return `<div class="kpi"><div class="l">${esc(label)}</div><div class="v">${fmt(val)}</div></div>`}
function groupBars(rs,key,valKey,accent){
  let m={};rs.forEach(r=>{let k=r[key];if(k===null||k==='')k='Sin dato';m[k]=(m[k]||0)+num(r[valKey])});
  let arr=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10),mx=arr[0]?.[1]||1;
  return `<div class="bars">${arr.map(([k,v])=>`<div class="barrow"><div class="barlabel" title="${esc(k)}">${esc(k)}</div><div class="barval">${fmt(v)}</div><div class="barbg"><div class="barfill" style="width:${Math.max(2,v/mx*100)}%;background:${accent}"></div></div></div>`).join('')||'<div class="empty">Sin datos para estos filtros</div>'}</div>`;
}
function trendChart(id,rs,valKey,accent){
  let m={};rs.forEach(r=>{let k=dkey(r.FECHA);if(k)m[k]=(m[k]||0)+num(r[valKey])});
  let entries=Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
  destroyChart(id);
  const el=document.getElementById(id); if(!el) return;
  if(!entries.length){ el.parentElement.innerHTML='<div class="empty">Sin datos para estos filtros</div>'; return; }
  CHARTS[id]=new Chart(el.getContext('2d'),{type:'line',
    data:{labels:entries.map(e=>fmtDate(e[0])),datasets:[{data:entries.map(e=>e[1]),borderColor:accent,backgroundColor:accent+'26',fill:true,tension:.3,pointRadius:2,pointHoverRadius:4,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}},
      scales:{x:{ticks:{color:'#8b93a1',font:{size:10.5,family:'Inter'},maxRotation:0,autoSkip:true,maxTicksLimit:12},grid:{display:false}},
               y:{ticks:{color:'#8b93a1',font:{size:10.5,family:'Inter'},callback:v=>fmt(v)},grid:{color:'#eef0f3'},beginAtZero:true}}}
  });
}
function downtimeChart(id,rs){
  let m={};rs.filter(r=>r.MOTIVO).forEach(r=>{let k=r.MOTIVO;m[k]=(m[k]||0)+(num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']))});
  let entries=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);
  destroyChart(id);
  const el=document.getElementById(id); if(!el) return;
  if(!entries.length){ el.parentElement.innerHTML='<div class="empty">Sin tiempo muerto registrado para estos filtros</div>'; return; }
  CHARTS[id]=new Chart(el.getContext('2d'),{type:'bar',
    data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:'#c1462f',borderRadius:4,maxBarThickness:22}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.x)+' min'}}},
      scales:{x:{ticks:{color:'#8b93a1',font:{size:10.5,family:'Inter'}},grid:{color:'#eef0f3'},beginAtZero:true},
               y:{ticks:{color:'#374151',font:{size:11.5,family:'Inter'}},grid:{display:false}}}}
  });
}

/* ---------- tabla ---------- */
function sortRows(dept,rs){
  let st=sortState[dept];
  if(!st){let col=(rs[0]&&('FOLIO' in rs[0]))?'FOLIO':'FECHA';st=sortState[dept]={col,dir:'asc'}}
  let{col,dir}=st;
  return rs.slice().sort((a,b)=>{
    let av=a[col],bv=b[col]; if(col==='FECHA'){av=dkey(av);bv=dkey(bv)}
    let an=Number(av),bn=Number(bv),cmp;
    if(av!==''&&av!=null&&bv!==''&&bv!=null&&!isNaN(an)&&!isNaN(bn))cmp=an-bn;
    else cmp=String(av??'').localeCompare(String(bv??''),'es',{numeric:true});
    return dir==='asc'?cmp:-cmp;
  });
}
function toggleSort(dept,col){let st=sortState[dept]||{col,dir:'asc'};if(st.col===col)st.dir=st.dir==='asc'?'desc':'asc';else{st.col=col;st.dir='asc'}sortState[dept]=st;renderDept(dept)}
function table(dept,rs){
  let cols=Object.keys(rows(dept)[0]||{}).filter(k=>k!=='Visible'&&k!=='Registro visible'&&!k.endsWith('_2')).slice(0,16);
  let sorted=sortRows(dept,rs);let st=sortState[dept]||{};
  if(!sorted.length) return '<div class="empty">Sin registros para estos filtros</div>';
  return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th onclick="toggleSort('${dept}','${esc(c)}')">${esc(c)}${st.col===c?`<span class="arrow">${st.dir==='asc'?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead><tbody>${sorted.map(r=>`<tr>${cols.map(c=>{let v=r[c];if(c==='FECHA')return `<td>${esc(fmtDate(v))}</td>`;return `<td class="${isNum(v)?'num':''}">${isNum(v)?fmt(v):esc(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- vista de área ---------- */
function renderDept(dept){
  current=dept;nav();
  let c=cfg[dept],rs=filtered(dept);
  let total=sum(rs,c.value);
  let wo=new Set(rs.map(r=>r['NO. WO']).filter(v=>v!==null&&v!==undefined&&v!=='')).size;
  let down=sum(rs,'TIEMPO MUERTO (MINS)')+sum(rs,'TIEMPO MUERTO');
  let count=rs.length;
  let extra=dept==='Lavanderia'?sum(rs,'TOTAL KGS'):dept==='Cuadros'?new Set(rs.map(r=>r['PROCESO']).filter(Boolean)).size:dept==='Ejemplos'?new Set(rs.map(r=>r['CLIENTE']).filter(Boolean)).size:wo;
  let k3=dept==='Lavanderia'?'Total KGS':dept==='Cuadros'?'Procesos':dept==='Ejemplos'?'Clientes':'WO contabilizadas';
  let ds=dates(rs);
  let second=c.groups.find(x=>x!==c.group);

  document.getElementById('view').innerHTML=`
    <div class="top"><div><h1 class="title">${esc(c.title)}</h1><div class="desc">${esc(c.desc)}</div></div><div class="updated">Datos cargados: ${esc(lastDate())}</div></div>
    ${filters(dept)}
    <div class="kpis" style="--accent:${c.accent}">${kpi(c.metric,total)}${kpi(k3,extra)}${kpi('Registros visibles',count)}${c.hasDowntime?kpi('Tiempo muerto (min)',down):kpi('Días con actividad',ds.length)}</div>
    <div class="grid">
      <div class="card"><h3>Producción por fecha</h3><div class="chartbox"><canvas id="chTrend"></canvas></div></div>
      <div class="card"><h3>Distribución por ${esc(c.group)}</h3>${groupBars(rs,c.group,c.value,c.accent)}</div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Detalle por ${esc(second||c.group)}</h3><div id="group2"></div></div>
      <div class="card"><h3>Indicadores del periodo</h3>
        <div class="note">Periodo: <b>${ds.length?fmtDate(ds[0]):'—'}</b> a <b>${ds.length?fmtDate(ds.at(-1)):'—'}</b></div>
        <div class="note">Se consultan los registros marcados como visibles en la bitácora.</div>
        <div class="note">Total de registros mostrados: <b>${fmt(count)}</b></div>
      </div>
    </div>
    ${c.hasDowntime?`<div class="card" style="margin-bottom:16px"><h3>Tiempo muerto por motivo (min)</h3><div class="chartbox short"><canvas id="chDowntime"></canvas></div></div>`:''}
    <div class="card"><h3>Registros</h3>${table(dept,rs)}</div>
    <div class="card" style="margin-top:16px"><h3>Comentarios</h3><div class="comment-box">${esc(comentarios(dept))||`Sin comentarios todavía. Escríbelo en la celda de comentarios de "${esc(dept)}" en tu Google Sheet — aparecerá aquí para todos en la próxima sincronización.`}</div></div>
    <div class="footer">Fuente: Bitacora de Produccion.xlsx (OneDrive) · La pestaña "Resumen Direccion" fue excluida.</div>`;

  trendChart('chTrend', rs, c.value, c.accent);
  document.getElementById('group2').innerHTML = groupBars(rs, second||c.group, c.value, c.accent);
  if(c.hasDowntime) downtimeChart('chDowntime', rs);
  updateValuesNoRender(dept);
}
function updateValuesNoRender(dept){let dim=document.getElementById('fDim')?.value||'',sel=document.getElementById('fVal');if(!sel)return;let rs=baseVis(dept);sel.innerHTML='<option value="">Todos</option>'+options(rs,dim).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function show(dept){current=dept;if(dept==='General')renderGeneral();else renderDept(dept)}

/* ---------- vista general ---------- */
function downValue(r){return num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO'])}
function renderGeneral(){
 nav(); const stats=depts.map(d=>({d,c:cfg[d],rs:baseVis(d),total:sum(baseVis(d),cfg[d].value),down:baseVis(d).reduce((a,r)=>a+downValue(r),0)}));
 const cards=stats.map(x=>`<div class="card dept" style="--accent:${x.c.accent}" onclick="show('${x.d}')"><span class="pill">${x.d==='Lavanderia'?'LAVANDERÍA':x.d.toUpperCase()}</span><div class="num">${fmt(x.total)}</div><div class="desc">${esc(x.c.metric)}</div><div class="note">${fmt(x.rs.length)} registros visibles</div></div>`).join('');
 const totalDown=stats.reduce((a,x)=>a+x.down,0), maxProd=[...stats].sort((a,b)=>b.total-a.total)[0], maxDown=[...stats].sort((a,b)=>b.down-a.down)[0];
 document.getElementById('view').innerHTML=`<div class="top"><div><h1 class="title">Dashboard de Producción 3.0</h1><div class="desc">Vista ejecutiva de todas las áreas · actualización automática cada 60 segundos</div></div><div class="tools"><input id="globalSearch" class="searchbar" placeholder="🔍 Buscar OT, máquina, cliente…" oninput="globalSearch(this.value)"><button class="iconbtn" onclick="toggleTheme()">☀️/🌙</button><button class="iconbtn" onclick="exportPDF()">📄 PDF</button><div class="updated">Último registro: ${esc(lastDate())}</div></div></div>
 <div class="card"><h3>Áreas de producción</h3><div class="deptgrid">${cards}</div></div>
 <div class="executive"><div class="exec">Producción líder<b>${esc(maxProd.d)}</b><small>${fmt(maxProd.total)}</small></div><div class="exec">Tiempo muerto total<b>${fmt(totalDown)} min</b><small>Áreas con registro</small></div><div class="exec">Mayor tiempo muerto<b>${esc(maxDown.d)}</b><small>${fmt(maxDown.down)} min</small></div><div class="exec">Áreas activas<b>${stats.filter(x=>x.rs.length).length}</b><small>Último registro ${esc(lastDate())}</small></div></div>
 <div class="widegrid"><div class="card"><h3>Producción total por área</h3><div class="chartbox"><canvas id="chProd"></canvas></div></div><div class="card"><h3>Tiempo muerto por área (min)</h3><div class="chartbox"><canvas id="chDown"></canvas></div></div></div>
 <div class="widegrid"><div class="card"><h3>Top 5 motivos de tiempo muerto</h3><div class="chartbox"><canvas id="chReasons"></canvas></div></div><div class="card"><h3>Resumen ejecutivo</h3><div class="comment-box">Mayor producción: <b>${esc(maxProd.d)}</b> (${fmt(maxProd.total)}).<br><br>Mayor tiempo muerto: <b>${esc(maxDown.d)}</b> (${fmt(maxDown.down)} min).<br><br>Registros visibles: <b>${fmt(stats.reduce((a,x)=>a+x.rs.length,0))}</b>.<br><br>Última actualización: <b>${esc(lastDate())}</b>.</div></div></div><div class="footer">Dashboard de Producción 3.0 · actualización automática activa</div>`;
 const labels=stats.map(x=>x.d==='Lavanderia'?'Lavandería':x.d), colors=stats.map(x=>x.c.accent); ['chProd','chDown','chReasons'].forEach(destroyChart);
 CHARTS.chProd=new Chart(document.getElementById('chProd'),{type:'bar',data:{labels,datasets:[{data:stats.map(x=>x.total),backgroundColor:colors,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true},y:{grid:{display:false}}}}});
 CHARTS.chDown=new Chart(document.getElementById('chDown'),{type:'bar',data:{labels,datasets:[{data:stats.map(x=>x.down),backgroundColor:colors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
 const reasons={}; stats.forEach(x=>x.rs.forEach(r=>{let v=downValue(r),m=String(r.MOTIVO||'Sin motivo').trim();if(v>0)reasons[m]=(reasons[m]||0)+v})); const top=Object.entries(reasons).sort((a,b)=>b[1]-a[1]).slice(0,5);
 CHARTS.chReasons=new Chart(document.getElementById('chReasons'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1]),backgroundColor:'#c9762f',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true},y:{grid:{display:false}}}}});
}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');renderGeneral()}
function globalSearch(q){let box=document.getElementById('searchResults')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'searchResults',className:'search-results'}));q=q.trim().toLowerCase();if(q.length<2){box.style.display='none';return}let out=[];depts.forEach(d=>baseVis(d).forEach(r=>{if(out.length<50&&Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)))out.push({d,r})}));box.innerHTML=out.length?out.map(x=>`<div class="sr" onclick="show('${x.d}');document.getElementById('searchResults').style.display='none'"> <b>${esc(x.d)}</b> · ${esc(fmtDate(x.r.FECHA))} · ${esc(x.r['NO. OT']||x.r.CLIENTE||x.r['NO. MAQUINA']||'Registro coincidente')}</div>`).join(''):'<div class="sr">Sin resultados</div>';box.style.display='block'}
async function exportPDF(){const {jsPDF}=window.jspdf||{};if(!jsPDF||!window.html2canvas){alert('No se pudo cargar el módulo PDF.');return}const el=document.getElementById('view'),canvas=await html2canvas(el,{scale:1.5,backgroundColor:getComputedStyle(document.body).getPropertyValue('--bg')});const pdf=new jsPDF('p','mm','a4'),w=190,h=canvas.height*w/canvas.width,img=canvas.toDataURL('image/jpeg',.92);let y=0;pdf.addImage(img,'JPEG',10,y+8,w,h);while(h+y>277){y-=277;pdf.addPage();pdf.addImage(img,'JPEG',10,y+8,w,h)}pdf.save(`Dashboard_Produccion_${new Date().toISOString().slice(0,10)}.pdf`)}
/* ---------- exportar / carga ---------- */
function downloadCSV(dept){
  let rs=filtered(dept),cols=Object.keys(rows(dept)[0]||{}).filter(k=>k!=='Visible'&&k!=='Registro visible'&&!k.endsWith('_2'));
  let csv='\ufeff'+[cols.join(','),...rs.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n');
  let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`${dept}_filtrado.csv`;a.click();URL.revokeObjectURL(a.href);
}
let DATA_SIGNATURE='';async function loadData(silent=false){try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),sig=JSON.stringify(d);if(sig!==DATA_SIGNATURE){DATA=d;DATA_SIGNATURE=sig;if(!silent||current==='General')show(current);else show(current)}}catch(e){if(!silent)document.getElementById('view').innerHTML='<div class="card"><h2>No se pudo cargar data.json</h2><p>Verifica que esté junto a index.html.</p></div>';console.error(e)}}
if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');loadData();setInterval(()=>loadData(true),60000);
</script>
