<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JV International — Dashboard de Producción</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#173b35;--muted:#687873;--line:#dfe8e5;--side:#101a20;--green:#08776b;--lime:#b8da45;--shadow:0 5px 18px #153b3220;--r:13px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#192622;font-family:Inter,Segoe UI,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:var(--side);padding:18px 14px;color:#dce6e3;position:sticky;top:0;height:100vh}.logoBox{height:75px;background:#fff;border-radius:7px;padding:7px;display:flex;align-items:center}.logoBox img{width:100%;height:100%;object-fit:contain}.sideLabel{font-size:9px;letter-spacing:1.2px;color:#83938e;margin:13px 7px 7px}.nav{display:grid;gap:3px}.nav button{border:0;background:none;color:#c9d2d0;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#21342f;color:#fff}.main{width:calc(100% - 230px);max-width:1450px;padding:25px 28px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:17px}.title{font-size:27px;margin:0;color:#132b27}.desc{font-size:13px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:9px;align-items:end}.field{display:grid;gap:4px}.field label,.klabel{font-size:10px;color:#71807c;text-transform:uppercase;letter-spacing:.35px}.field select,.field input{height:36px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 10px}.periodInfo{font-size:11px;color:#667570}.periodInfo b{display:block;color:#2e4842}.btn{height:36px;border:0;border-radius:7px;padding:0 14px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.panel,.card,.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.panel{padding:16px;margin-bottom:15px}.sectionTitle{font-size:14px;margin:0 0 13px}.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.area{padding:15px;border-left:4px solid var(--accent);cursor:pointer}.area b{font-size:10px}.area .value{font:700 24px ui-monospace,Consolas;margin:9px 0}.note{font-size:11px;color:var(--muted)}.executive{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.exec{padding:15px;border-top:3px solid var(--green)}.exec .value{font:700 22px ui-monospace,Consolas;margin:8px 0 3px;line-height:1.15}.exec small{color:var(--muted)}.charts{display:grid;gap:15px}.bars{display:grid;gap:10px}.bar{display:grid;grid-template-columns:150px 190px 1fr;align-items:center;gap:10px;font-size:12px}.bar .val{font:600 12px ui-monospace,Consolas}.track{height:7px;background:#e8efed;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px}.machineGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.machine{padding:14px;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px}.machine strong{font-size:16px}.machine .total{font:600 13px ui-monospace,Consolas;margin:6px 0}.machine .reason{font-size:12px;color:var(--muted)}.machine .reason b{display:block;color:#263b36;margin-top:3px}.machine .mHead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}.machine .mHead .total{margin:0;font-weight:700}.machine .breakdownLabel{font-size:9px;letter-spacing:.3px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}.machine .breakdownRow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:11px;margin:6px 0}.machine .breakdownRow .track{height:5px}.machine .breakdownRow .bval{font:700 10.5px ui-monospace,Consolas;white-space:nowrap}.filters{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;align-items:end}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:15px 0}.kpi{padding:15px;border-left:4px solid var(--accent)}.kpi .value{font:700 24px ui-monospace,Consolas;margin-top:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.chart{height:280px}.tableWrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:9px}.table{border-collapse:collapse;width:100%;font-size:12px}.table th{position:sticky;top:0;background:#f5f8f7;padding:9px;text-align:left;white-space:nowrap}.table td{padding:8px 9px;border-top:1px solid #edf1f0;white-space:nowrap}.table td.num{text-align:right;font:600 12px ui-monospace,Consolas}.legend{font-size:12px;margin-bottom:10px}.sw{display:inline-block;width:9px;height:9px;margin:0 5px 0 13px}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:950px){.side{width:185px}.main{width:calc(100% - 185px)}.areas,.executive,.kpis,.machineGrid,.two{grid-template-columns:1fr 1fr}.filters{grid-template-columns:repeat(3,1fr)}.bar{grid-template-columns:100px 150px 1fr}}@media(max-width:650px){.app{display:block}.side{width:100%;height:auto;position:static}.main{width:100%;padding:14px}.areas,.executive,.kpis,.machineGrid,.two,.filters{grid-template-columns:1fr}.top{display:block}.tools{margin-top:12px;flex-wrap:wrap}}
</style></head><body><div class="app"><aside class="side"><div class="logoBox"><img src="Logo_JV International.png" alt="JV International Solutions Inc."></div><div class="sideLabel">DASHBOARD DE PRODUCCIÓN</div><nav id="nav" class="nav"></nav></aside><main id="view" class="main"></main></div>
<script>
'use strict';
let DATA={},PAGE='General',PERIOD=localStorage.getItem('jvPeriod')||'',STATE={},CHART=null;
const CFG={
 Estampado:{title:'Estampado',value:'TOTAL',metric:'Piezas trabajadas',accent:'#08776b',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE HIT','ESPECIALIDAD'],down:true},
 Neck:{title:'Neck',value:'TOTAL',metric:'Total de piezas',accent:'#3c6e8f',groups:['NO. MAQUINA','TIPO DE PRENDA']},
 Cuadros:{title:'Cuadros',value:'CANT. CUADROS',metric:'Total de cuadros',accent:'#4a55a8',groups:['PROCESO','ESPECIALIDAD','DEPT']},
 Empaque:{title:'Empaque',value:'TOTAL',metric:'Total de piezas',accent:'#c9762f',groups:['TIPO DE EMPAQUE','TIPO DE PRENDA'],down:true},
 Ejemplos:{title:'Ejemplos',value:'PRENDAS',metric:'Prendas',accent:'#8a5cb0',groups:['DEPTO','CLIENTE','TIENDA','ESPECIALIDAD','TIPO DE HIT']},
 Lavanderia:{title:'Lavandería',value:'CANTIDAD DE PIEZAS',metric:'Cantidad de piezas',accent:'#3f7d3a',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE PROCESO','COLOR'],down:true}
};
const DEPTS=Object.keys(CFG),LABEL={'NO. MAQUINA':'Máquina','TIPO DE PRENDA':'Tipo de prenda','TIPO DE HIT':'Tipo de hit',ESPECIALIDAD:'Especialidad',MOTIVO:'Motivo',PROCESO:'Proceso',DEPT:'Departamento',DEPTO:'Departamento',CLIENTE:'Cliente',TIENDA:'Tienda','TIPO DE EMPAQUE':'Tipo de empaque','TIPO DE PROCESO':'Tipo de proceso',COLOR:'Color'};
const EMPTY={'NO. MAQUINA':'Sin máquina','TIPO DE PRENDA':'Sin tipo de prenda','TIPO DE HIT':'Sin tipo de hit',ESPECIALIDAD:'Sin especialidad',MOTIVO:'Sin motivo',PROCESO:'Sin proceso',DEPT:'Sin departamento',DEPTO:'Sin departamento',CLIENTE:'Sin cliente',TIENDA:'Sin tienda','TIPO DE EMPAQUE':'Sin tipo de empaque','TIPO DE PROCESO':'Sin tipo de proceso',COLOR:'Sin color'};
const IDS=new Set(['FOLIO','NO. WO','ESTILO','NO. MAQUINA','NO. FOLDER']);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=v=>Number.isFinite(Number(v))?Number(v):0, fmt=v=>new Intl.NumberFormat('es-MX',{maximumFractionDigits:0}).format(num(v)), dateKey=v=>String(v||'').slice(0,10), dateFmt=v=>{let p=dateKey(v).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:'—'}, empty=v=>v==null||String(v).trim()==='', sum=(a,k)=>a.reduce((s,r)=>s+num(r[k]),0), time=v=>`${fmt(v)} min / ${(num(v)/60).toFixed(1)} hrs`;
function periodMonths(){

  const months = new Set();

  DEPTS.forEach(dept => {

    (DATA[dept] || []).forEach(r => {

      const fecha = dateKey(r.FECHA);

      if(!fecha) return;

      months.add(
        fecha.slice(0,7)
      );

    });

  });

  return [...months]
    .sort()
    .reverse();
}
function range(){

  const allDates =
    DEPTS.flatMap(
      d =>
        (DATA[d] || [])
          .map(r => dateKey(r.FECHA))
          .filter(Boolean)
    )
    .sort();

  const minDate =
    allDates[0];

  const maxDate =
    allDates.at(-1);

  if(PERIOD === 'all'){

    return [
      minDate,
      maxDate
    ];

  }

  if(PERIOD === '30'){

    let end =
      new Date(maxDate);

    let start =
      new Date(end);

    start.setDate(
      start.getDate() - 29
    );

    return [
      start.toISOString().slice(0,10),
      maxDate
    ];
  }

  if(PERIOD === '90'){

    let end =
      new Date(maxDate);

    let start =
      new Date(end);

    start.setDate(
      start.getDate() - 89
    );

    return [
      start.toISOString().slice(0,10),
      maxDate
    ];
  }

  if(PERIOD === 'current'){

    return [
      maxDate.slice(0,7) + '-01',
      maxDate
    ];
  }

  let [y,m] =
    PERIOD.split('-')
      .map(Number);

  return [

    `${y}-${String(m)
      .padStart(2,'0')}-01`,

    new Date(
      Date.UTC(y,m,0)
    )
    .toISOString()
    .slice(0,10)

  ];
}
function rows(d){let [a,b]=range();return (DATA[d]||[]).filter(r=>{let k=dateKey(r.FECHA);return k>=a&&k<=b})}
function monthLabel(){

  if(PERIOD === 'all')
    return 'Todo el histórico';

  if(PERIOD === 'current')
    return 'Mes actual';

  if(PERIOD === '30')
    return 'Últimos 30 días';

  if(PERIOD === '90')
    return 'Últimos 90 días';

  let [y,m] =
    PERIOD.split('-');

  return new Intl.DateTimeFormat(
    'es-MX',
    {
      month:'long',
      year:'numeric',
      timeZone:'UTC'
    }
  ).format(
    new Date(
      `${y}-${m}-01T00:00:00Z`
    )
  );

}
function nav(){document.querySelector('#nav').innerHTML=['General',...DEPTS].map(d=>`<button class="${PAGE===d?'active':''}" onclick="show('${d}')">${d==='Lavanderia'?'Lavandería':d}</button>`).join('')}
function periodTools(){

  return `
    <div class="tools">

      <div class="field">

        <label>Período activo</label>

        <select
          onchange="
            PERIOD=this.value;
            localStorage.setItem(
              'jvPeriod',
              PERIOD
            );
            STATE={};
            setTimeout(
  () => show(PAGE),
  10
);

          "
        >

          <option
            value="all"
            ${PERIOD==='all'?'selected':''}
          >
            Todo el histórico
          </option>

          <option
            value="current"
            ${PERIOD==='current'?'selected':''}
          >
            Mes actual
          </option>

          <option
            value="30"
            ${PERIOD==='30'?'selected':''}
          >
            Últimos 30 días
          </option>

          <option
            value="90"
            ${PERIOD==='90'?'selected':''}
          >
            Últimos 90 días
          </option>

          ${periodMonths()
            .map(m => `
              <option
                value="${m}"
                ${m===PERIOD?'selected':''}
              >
                ${monthName(m)}
              </option>
            `)
            .join('')
          }

        </select>

      </div>

      <div class="periodInfo">

        <b>Período activo</b>

        ${periodText()}

      </div>

      <button
        class="btn"
        onclick="pdfGeneral()"
      >
        Exportar PDF
      </button>

    </div>
  `;
}
function monthName(m){let [y,x]=m.split('-');return new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${y}-${x}-01T00:00:00Z`))}
 function periodText(){

  const [a,b] =
    range();

  if(PERIOD === 'all')
    return `
      Todo el histórico
      <br>
      ${dateFmt(a)} – ${dateFmt(b)}
    `;

  if(PERIOD === 'current')
    return `
      Mes actual
      <br>
      ${dateFmt(a)} – ${dateFmt(b)}
    `;

  if(PERIOD === '30')
    return `
      Últimos 30 días
      <br>
      ${dateFmt(a)} – ${dateFmt(b)}
    `;

  if(PERIOD === '90')
    return `
      Últimos 90 días
      <br>
      ${dateFmt(a)} – ${dateFmt(b)}
    `;

  return `
    ${monthName(PERIOD)}
    <br>
    ${dateFmt(a)} – ${dateFmt(b)}
  `;
}
function downtime(rs){return rs.reduce((s,r)=>s+num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']),0)}
function group(rs,key,value){let m={};rs.forEach(r=>{let k=empty(r[key])?(EMPTY[key]||'Sin información'):String(r[key]).trim();m[k]=(m[k]||0)+num(r[value])});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function downGroup(rs,key){let m={};rs.forEach(r=>{let v=num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']);if(v){let k=empty(r[key])?(EMPTY[key]||'Sin información'):String(r[key]).trim();m[k]=(m[k]||0)+v}});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(a,color,timeMode=false){let mx=a[0]?.[1]||1,tot=a.reduce((s,x)=>s+x[1],0);return `<div class="bars">${a.map(([k,v])=>`<div class="bar"><div>${esc(k)}</div><div class="val">${timeMode?time(v):fmt(v)} · ${tot?(v/tot*100).toFixed(1):0}%</div><div class="track"><div class="fill" style="width:${v/mx*100}%;background:${color}"></div></div></div>`).join('')||'<div class="empty">0</div>'}</div>`}
function machines(rs){let m={};rs.forEach(r=>{let v=num(r['TIEMPO MUERTO (MINS)'])+num(r['TIEMPO MUERTO']);if(!v)return;let ma=empty(r['NO. MAQUINA'])?'Sin máquina':r['NO. MAQUINA'],mo=empty(r.MOTIVO)?'Sin motivo':r.MOTIVO;m[ma]??={t:0,r:{}};m[ma].t+=v;m[ma].r[mo]=(m[ma].r[mo]||0)+v});return Object.entries(m).sort((a,b)=>b[1].t-a[1].t).slice(0,6).map(([ma,o])=>{let reasons=Object.entries(o.r).sort((a,b)=>b[1]-a[1]).slice(0,4),mx=reasons[0]?.[1]||1;return `<div class="machine"><div class="mHead"><strong>${esc(ma)}</strong><span class="total">${time(o.t)}</span></div><div class="breakdownLabel">Desglose de fallas</div>${reasons.map(([mo,v])=>`<div class="breakdownRow"><span>${esc(mo)}</span><div class="track"><div class="fill" style="width:${(v/mx*100)}%;background:#c0392b"></div></div><span class="bval">${fmt(v)} min (${(v/o.t*100).toFixed(1)}%)</span></div>`).join('')}</div>`}).join('')||'<div class="empty">Sin tiempo muerto por máquina</div>'}
function general(){PAGE='General';nav();let s=DEPTS.map(d=>{let r=rows(d),c=CFG[d];return {d,r,c,total:sum(r,c.value),down:downtime(r)}}),prod=[...s].sort((a,b)=>b.total-a.total),dw=[...s].sort((a,b)=>b.down-a.down),td=s.reduce((z,x)=>z+x.down,0),all=s.flatMap(x=>x.r);document.querySelector('#view').innerHTML=`<header class="top"><div><h1 class="title">Dashboard de Producción</h1><div class="desc">Consulta la información de producción por área.</div></div>${periodTools()}</header><section class="panel"><h2 class="sectionTitle">Áreas de producción</h2><div class="areas">${s.map(x=>`<article class="card area" style="--accent:${x.c.accent}" onclick="show('${x.d}')"><b>${x.c.title.toUpperCase()}</b><div class="value">${fmt(x.total)}</div><div class="note">${fmt(x.r.length)} registros del período</div></article>`).join('')}</div></section><section class="executive"><article class="exec card"><div class="klabel">Mayor producción</div><div class="value">${fmt(prod[0].total)}</div><small>${prod[0].c.title}</small></article><article class="exec card"><div class="klabel">Tiempo muerto total</div><div class="value">${time(td)}</div><small>Áreas con registro</small></article><article class="exec card"><div class="klabel">Mayor tiempo muerto</div><div class="value">${time(dw[0].down)}</div><small>${dw[0].c.title}</small></article><article class="exec card"><div class="klabel">Áreas activas</div><div class="value">${s.filter(x=>x.r.length).length}</div><small>Con registros</small></article></section><div class="charts"><section class="panel"><h2 class="sectionTitle">Producción total por área (piezas)</h2>${bars(prod.map(x=>[x.c.title,x.total]),'#08776b')}</section><section class="panel"><h2 class="sectionTitle">Tiempo muerto por área</h2>${bars(dw.map(x=>[x.c.title,x.down]),'#08776b',true)}</section><section class="panel"><h2 class="sectionTitle">Principales motivos de tiempo muerto</h2>${bars(downGroup(all,'MOTIVO'),'#08776b',true)}</section><section class="panel"><h2 class="sectionTitle">Máquinas con mayor incidencia</h2><div class="machineGrid">${machines(all)}</div></section></div>`}
function state(d){

  let [a,b] = range();

  if(
    !STATE[d]
    ||
    STATE[d].period !== PERIOD
  ){

    STATE[d] = {

      period : PERIOD,

      a,

      b,

      key : '',

      val : ''

    };

  }

  return STATE[d];

}
function filtered(d){let st=state(d);return (DATA[d]||[]).filter(r=>{let k=dateKey(r.FECHA),ok=k>=st.a&&k<=st.b;if(st.key&&st.val)ok=ok&&(st.val==='__EMPTY__'?empty(r[st.key]):String(r[st.key])===st.val);return ok})}
function filterUI(d){let c=CFG[d],st=state(d),base=DATA[d]||[],vals=st.key?[...new Set(base.filter(r=>!empty(r[st.key])).map(r=>String(r[st.key])))].sort():[],has=st.key&&base.some(r=>empty(r[st.key]));return `<div class="panel filters"><div class="field"><label>Desde</label><input type="date" value="${st.a}" onchange="STATE['${d}'].a=this.value;area('${d}')"></div><div class="field"><label>Hasta</label><input type="date" value="${st.b}" onchange="STATE['${d}'].b=this.value;area('${d}')"></div><div class="field"><label>Filtrar por</label><select onchange="STATE['${d}'].key=this.value;STATE['${d}'].val='';area('${d}')"><option value="">Sin filtro adicional</option>${c.groups.map(k=>`<option value="${k}" ${st.key===k?'selected':''}>${LABEL[k]}</option>`).join('')}</select></div><div class="field"><label>Selección</label><select ${st.key?'':'disabled'} onchange="STATE['${d}'].val=this.value;area('${d}')"><option value="">Todos</option>${vals.map(v=>`<option ${st.val===v?'selected':''}>${esc(v)}</option>`).join('')}${has?`<option value="__EMPTY__" ${st.val==='__EMPTY__'?'selected':''}>${EMPTY[st.key]}</option>`:''}</select></div><button class="btn" onclick="delete STATE['${d}'];area('${d}')">Restablecer</button><button class="btn" onclick="pdfArea('${d}')">Exportar PDF</button></div>`}
function unique(rs,k){return new Set(rs.map(r=>r[k]).filter(v=>!empty(v))).size}
function trend(
  rs,
  key,
  id,
  color
){

  let m = {};

  rs.forEach(r => {

    const fecha = dateKey(r.FECHA);

    if(!fecha) return;

    m[fecha] =
      (m[fecha] || 0)
      + num(r[key]);

  });

  const points =
    Object.entries(m).sort();

  if(CHART){
    CHART.destroy();
    CHART = null;
  }

  const canvas =
    document.getElementById(id);

  if(!canvas){
    console.warn(
      'Canvas no encontrado:',
      id
    );
    return;
  }

  if(!points.length){
    return;
  }

  CHART =
    new Chart(
      canvas.getContext('2d'),
      {
        type:'line',

        data:{
          labels:
            points.map(
              p => dateFmt(p[0])
            ),

          datasets:[
            {
              data:
                points.map(
                  p => p[1]
                ),

              borderColor:
                color,

              backgroundColor:
                color + '20',

              fill:true,

              tension:0.3,

              pointRadius:2,

              borderWidth:2
            }
          ]
        },

        options:{
          responsive:true,

          maintainAspectRatio:false,

          plugins:{
            legend:{
              display:false
            }
          },

          scales:{
            y:{
              beginAtZero:true
            }
          }
        }

      }
    );

}
function kpi(l,v,a){return `<div class="kpi" style="--accent:${a}"><div class="klabel">${l}</div><div class="value">${typeof v==='string'?v:fmt(v)}</div></div>`}
function table(d,rs){let cols=Object.keys(DATA[d]?.[0]||{}).filter(k=>k&&k!=='Visible'&&k!=='Registro visible').slice(0,16);if(d==='Lavanderia'){cols=cols.filter(x=>x!=='DURACIÓN');let i=cols.indexOf('HORA DE TERMINADO');cols.splice(i+1,0,'DURACIÓN')}let head=k=>k==='HORA DE COMIENZO'?'Hora inicio':k==='HORA DE TERMINADO'?'Hora fin':k==='DURACIÓN'?'Duración':/NOTAS?/i.test(k)?'Comentarios':k;return `<div class="tableWrap"><table class="table"><thead><tr>${cols.map(k=>`<th>${head(k)}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${cols.map(k=>{let v=k==='DURACIÓN'?duration(r['HORA DE COMIENZO'],r['HORA DE TERMINADO']):r[k];if(k==='FECHA')v=dateFmt(v);if(/HORA DE (COMIENZO|TERMINADO)/.test(k))v=hour(v);let n=typeof v==='number'&&!IDS.has(k);return `<td class="${n?'num':''}">${n?fmt(v):esc(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function hour(v){let m=String(v||'').match(/(?:T|^)(\d{1,2}):(\d{2})/);return m?`${m[1].padStart(2,'0')}:${m[2]}`:'—'}function duration(a,b){a=hour(a);b=hour(b);if(a==='—'||b==='—')return '—';let [h,m]=a.split(':').map(Number),[x,y]=b.split(':').map(Number),z=x*60+y-h*60-m;if(z<0)z+=1440;return `${Math.floor(z/60)?Math.floor(z/60)+'h ':''}${z%60}m`}
function laundryType(r){return /lienzo|tela/i.test(String(r['TIPO DE PRENDA']||''))?'Lienzos':'Prendas'}
function stack(rs,key){let m={};rs.forEach(r=>{let k=key==='FECHA'?dateFmt(r.FECHA):(empty(r[key])?(EMPTY[key]||'Sin información'):r[key]),t=laundryType(r);m[k]??={Lienzos:0,Prendas:0};m[k][t]+=num(r['TOTAL KGS'])});let a=Object.entries(m).sort((x,y)=>(y[1].Lienzos+y[1].Prendas)-(x[1].Lienzos+x[1].Prendas)),mx=Math.max(1,...a.map(x=>x[1].Lienzos+x[1].Prendas));return `<div class="legend"><i class="sw" style="background:#08776b"></i>Lienzos<i class="sw" style="background:#b8da45"></i>Prendas</div><div class="bars">${a.map(([k,o])=>`<div class="bar"><div>${esc(k)}</div><div class="val">${fmt(o.Lienzos+o.Prendas)} kg</div><div class="track" style="display:flex"><div class="fill" style="width:${o.Lienzos/mx*100}%;background:#08776b"></div><div class="fill" style="width:${o.Prendas/mx*100}%;background:#b8da45"></div></div></div>`).join('')}</div>`}
function area(d){PAGE=d;nav();let c=CFG[d],r=filtered(d),total=sum(r,c.value),down=downtime(r),fourth=d==='Ejemplos'?['Tiendas',unique(r,'TIENDA')]:d==='Neck'?['Máquinas activas',unique(r,'NO. MAQUINA')]:d==='Cuadros'?['Departamentos',unique(r,'DEPT')]:[c.down?'Tiempo muerto':'Días con actividad',c.down?time(down):unique(r,'FECHA')],second=d==='Lavanderia'?['Total KGS',sum(r,'TOTAL KGS')]:d==='Cuadros'?['Procesos',unique(r,'PROCESO')]:d==='Ejemplos'?['Clientes',unique(r,'CLIENTE')]:['WO contabilizadas',unique(r,'NO. WO')];document.querySelector('#view').innerHTML=`<header class="top"><div><h1 class="title">${c.title}</h1><div class="desc">Detalle operativo del período seleccionado.</div></div><div class="periodInfo"><b>Período activo</b>${periodText()}<br>${dateFmt(state(d).a)} – ${dateFmt(state(d).b)}</div></header>${filterUI(d)}<div class="kpis">${kpi(c.metric,total,c.accent)}${kpi(second[0],second[1],c.accent)}${kpi('Registros del período',r.length,c.accent)}${kpi(fourth[0],fourth[1],c.accent)}</div><section class="panel"><h2 class="sectionTitle">${d==='Lavanderia'?'Piezas':'Producción'} por fecha</h2><div class="chart"><canvas id="trend"></canvas></div></section>${d==='Lavanderia'?`<div class="two"><section class="panel"><h2 class="sectionTitle">Kilos por fecha (lienzos / prendas)</h2>${stack(r,'FECHA')}</section><section class="panel"><h2 class="sectionTitle">Kilos por máquina (lienzos / prendas)</h2>${stack(r,'NO. MAQUINA')}</section><section class="panel"><h2 class="sectionTitle">Kilos por proceso (lienzos / prendas)</h2>${stack(r,'TIPO DE PROCESO')}</section><section class="panel"><h2 class="sectionTitle">Kilos por color (lienzos / prendas)</h2>${stack(r,'COLOR')}</section></div>`:c.groups.map(k=>`<section class="panel"><h2 class="sectionTitle">Detalle por ${LABEL[k]}</h2>${bars(group(r,k,c.value),c.accent)}</section>`).join('')}${c.down?`<section class="panel"><h2 class="sectionTitle">Tiempo muerto por motivo</h2>${bars(downGroup(r,'MOTIVO'),c.accent,true)}</section><section class="panel"><h2 class="sectionTitle">Tiempo muerto por máquina</h2>${bars(downGroup(r,'NO. MAQUINA'),c.accent,true)}</section>`:''}<section class="panel"><h2 class="sectionTitle">Registros</h2>${table(d,r)}</section>`;trend(r,c.value,'trend',c.accent)}
function show(d){d==='General'?general():area(d)}
/* ===================================================================
   MOTOR COMPARTIDO DE REPORTES PDF
   Usado tanto por pdfGeneral() como por pdfArea(d) para que ambos
   reportes tengan exactamente el mismo diseño corporativo.
   =================================================================== */
let LOGO_IMG = null;
(function preloadLogo(){
  const img = new Image();
  img.onload = () => { LOGO_IMG = img; };
  img.src = 'Logo_JV International.png';
})();

function hexToRgb(hex){
  hex = String(hex || '#08776b').replace('#', '');
  if(hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

const PDF_W = 297, PDF_H = 210, PDF_MARGIN = 8, PDF_BAND_H = 32;
const PDF_CONTENT_TOP = 40, PDF_FOOTER_LINE_Y = 200, PDF_FOOTER_TEXT_Y = 205;
const PDF_BREAK_Y = 196;
const PDF_COL_W = (PDF_W - 2*PDF_MARGIN - 6) / 2;
const PDF_COL2_X = PDF_MARGIN + PDF_COL_W + 6;
const C_INK = [15, 61, 54], C_GREEN = [15, 110, 99], C_MUTED = [104, 120, 115],
      C_LINE = [223, 232, 229], C_BG = [247, 250, 249], C_ALERT = [192, 57, 43],
      C_TRACK = [230, 237, 233];

function pdfTruncate(pdf, text, maxW){
  text = String(text ?? '');
  if(pdf.getTextWidth(text) <= maxW) return text;
  while(text.length > 1 && pdf.getTextWidth(text + '\u2026') > maxW){
    text = text.slice(0, -1);
  }
  return text + '\u2026';
}

function pdfHeader(pdf, title, period){
  pdf.setFillColor(...C_INK);
  pdf.rect(0, 0, PDF_W, PDF_BAND_H, 'F');

  const badgeX = 8, badgeW = 54, badgeH = badgeW / 4.407;
  const badgeY = (PDF_BAND_H - badgeH) / 2;
  pdf.setFillColor(255, 255, 255);
  pdf.roundedRect(badgeX, badgeY, badgeW, badgeH, 1.5, 1.5, 'F');
  if(LOGO_IMG){
    const pad = 1.4;
    try{ pdf.addImage(LOGO_IMG, 'PNG', badgeX+pad, badgeY+pad, badgeW-2*pad, badgeH-2*pad); }
    catch(e){ /* el logo aún no cargó a tiempo; se omite sin romper el PDF */ }
  }

  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15);
  pdf.setTextColor(255, 255, 255);
  pdf.text(title, badgeX + badgeW + 8, PDF_BAND_H/2 + 2);

  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9.5);
  pdf.text('Per\u00edodo: ' + period, PDF_W - 8, 13, {align: 'right'});

  pdf._pdfPageNumSlots = pdf._pdfPageNumSlots || [];
  pdf._pdfPageNumSlots.push({page: pdf.internal.getNumberOfPages(), where: 'header', x: PDF_W-8, y: 19});
}

function pdfFooter(pdf){
  pdf.setDrawColor(...C_LINE);
  pdf.line(PDF_MARGIN, PDF_FOOTER_LINE_Y, PDF_W-PDF_MARGIN, PDF_FOOTER_LINE_Y);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.6);
  pdf.setTextColor(...C_MUTED);
  pdf.text('JV International Solutions Inc.  \u00b7  Generado: ' + new Date().toLocaleString('es-MX'),
    PDF_MARGIN, PDF_FOOTER_TEXT_Y);
  pdf._pdfPageNumSlots.push({page: pdf.internal.getNumberOfPages(), where: 'footer', x: PDF_W-PDF_MARGIN, y: PDF_FOOTER_TEXT_Y});
}

function pdfFinalizePageNumbers(pdf){
  const total = pdf.internal.getNumberOfPages();
  (pdf._pdfPageNumSlots || []).forEach(slot => {
    pdf.setPage(slot.page);
    if(slot.where === 'header'){
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5);
      pdf.setTextColor(207, 227, 221);
    } else {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.6);
      pdf.setTextColor(...C_MUTED);
    }
    pdf.text(`P\u00e1gina ${slot.page} de ${total}`, slot.x, slot.y, {align: 'right'});
  });
}

function pdfKpiCard(pdf, x, y, w, h, label, value, sub){
  pdf.setFillColor(...C_BG); pdf.setDrawColor(...C_LINE);
  pdf.roundedRect(x, y, w, h, 2, 2, 'FD');
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.6);
  pdf.setTextColor(...C_MUTED);
  pdf.text(pdfTruncate(pdf, String(label).toUpperCase(), w-8), x+4, y+7);
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15);
  pdf.setTextColor(...C_INK);
  pdf.text(pdfTruncate(pdf, String(value), w-8), x+4, y+h*0.62);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.6);
  pdf.setTextColor(...C_MUTED);
  pdf.text(pdfTruncate(pdf, String(sub || ''), w-8), x+4, y+h-4);
}

/** Barras horizontales planas y compactas (etiqueta · barra · valor), el
 * mismo lenguaje visual ya usado en el informe general. Devuelve la
 * coordenada Y inferior para poder encadenar la siguiente sección. */
function pdfFlatBars(pdf, x, y, w, title, items, colorFn, valueFmt, labelW, rowH){
  rowH = rowH || 8;
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10.5);
  pdf.setTextColor(...C_INK);
  pdf.text(title, x, y);
  const top = y + 7;

  if(!items || !items.length){
    pdf.setFont('helvetica', 'italic'); pdf.setFontSize(8);
    pdf.setTextColor(...C_MUTED);
    pdf.text('Sin datos en el per\u00edodo seleccionado.', x, top + 2);
    return top + 8;
  }

  const maxVal = Math.max(1, ...items.map(it => it[1]));
  const barX0 = x + labelW;
  const barW = w - labelW - 30;
  items.forEach((it, i) => {
    const yy = top + i*rowH;
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.3);
    pdf.setTextColor(...C_INK);
    pdf.text(pdfTruncate(pdf, it[0], labelW-2), x, yy);
    pdf.setFillColor(...C_TRACK);
    pdf.roundedRect(barX0, yy-3, barW, 3, 1, 1, 'F');
    const fw = Math.max(0.8, barW * (it[1] / maxVal));
    pdf.setFillColor(...colorFn(it[0]));
    pdf.roundedRect(barX0, yy-3, fw, 3, 1, 1, 'F');
    pdf.setFontSize(8);
    pdf.text(valueFmt(it[1]), barX0 + barW + 3, yy);
  });
  return top + items.length*rowH;
}

/** Agrupa el tiempo muerto por máquina y, dentro de cada máquina, por
 * motivo — para poder mostrar el caso puntual de cada una (no solo cuál
 * falla más, sino específicamente por qué). */
function motivosByMachine(rs){
  const m = {};
  rs.forEach(r => {
    const v = num(r['TIEMPO MUERTO (MINS)']) + num(r['TIEMPO MUERTO']);
    if(!v) return;
    const ma = empty(r['NO. MAQUINA']) ? 'Sin m\u00e1quina' : r['NO. MAQUINA'];
    const mo = empty(r.MOTIVO) ? 'Sin motivo' : r.MOTIVO;
    m[ma] ??= {t: 0, r: {}};
    m[ma].t += v;
    m[ma].r[mo] = (m[ma].r[mo] || 0) + v;
  });
  return m;
}

/** Tarjeta compacta con el desglose de motivos específicos de una máquina
 * (encabezado con el total, y hasta 4 motivos con su propia barra). */
function pdfMachineFailureCard(pdf, x, y, w, h, label, total, details){
  pdf.setFillColor(...C_BG); pdf.setDrawColor(...C_LINE);
  pdf.roundedRect(x, y, w, h, 2, 2, 'FD');
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5);
  pdf.setTextColor(...C_INK);
  pdf.text(label, x+4, y+7.5);
  pdf.setTextColor(...C_ALERT);
  pdf.text(time(total), x+w-4, y+7.5, {align: 'right'});
  pdf.setDrawColor(...C_LINE);
  pdf.line(x+4, y+10, x+w-4, y+10);

  if(!details.length){
    pdf.setFont('helvetica', 'italic'); pdf.setFontSize(7.2);
    pdf.setTextColor(...C_MUTED);
    pdf.text('Sin desglose disponible.', x+4, y+17);
    return;
  }

  const maxv = Math.max(1, ...details.map(d => d[1]));
  const labelW = 30, rowH = (h - 14) / details.length;
  const barX0 = x + 4 + labelW;
  const barW = w - 8 - labelW - 32;
  details.forEach((d, i) => {
    const [motivo, mins, pct] = d;
    const yy = y + 15 + i*rowH;
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.9);
    pdf.setTextColor(...C_INK);
    pdf.text(pdfTruncate(pdf, motivo, labelW-2), x+4, yy);
    pdf.setFillColor(...C_TRACK);
    pdf.roundedRect(barX0, yy-2.3, barW, 2.6, 1, 1, 'F');
    const fw = Math.max(0.6, barW * (mins/maxv));
    pdf.setFillColor(...C_ALERT);
    pdf.roundedRect(barX0, yy-2.3, fw, 2.6, 1, 1, 'F');
    pdf.setFontSize(6.6);
    pdf.text(`${fmt(mins)} min (${pct.toFixed(1)}%)`, x+w-4, yy, {align: 'right'});
  });
}

/* ===================================================================
   REPORTE POR ÁREA — usa el mismo motor visual que el informe general,
   con paginación dinámica: si un área tiene muchos grupos de detalle,
   agrega páginas adicionales en vez de recortar información.
   =================================================================== */
function pdfArea(d){
  if(!window.jspdf){ alert('No se pudo cargar jsPDF'); return; }
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  pdf._pdfPageNumSlots = [];

  const c = CFG[d], st = state(d), r = filtered(d);
  const [from, to] = range();
  const period = `${dateFmt(from)} - ${dateFmt(to)}`;
  const total = sum(r, c.value), down = downtime(r);
  const areaTitle = d === 'Lavanderia' ? 'Lavander\u00eda' : c.title;

  const fourth = d === 'Ejemplos' ? ['Tiendas', unique(r,'TIENDA')]
    : d === 'Neck' ? ['M\u00e1quinas activas', unique(r,'NO. MAQUINA')]
    : d === 'Cuadros' ? ['Departamentos', unique(r,'DEPT')]
    : [c.down ? 'Tiempo muerto' : 'D\u00edas con actividad', c.down ? time(down) : unique(r,'FECHA')];
  const second = d === 'Lavanderia' ? ['Total KGS', sum(r,'TOTAL KGS')]
    : d === 'Cuadros' ? ['Procesos', unique(r,'PROCESO')]
    : d === 'Ejemplos' ? ['Clientes', unique(r,'CLIENTE')]
    : ['WO contabilizadas', unique(r,'NO. WO')];

  const areaColor = () => hexToRgb(c.accent);
  const title = `Informe de Producci\u00f3n: ${areaTitle}`;

  pdfHeader(pdf, title, period);

  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.4);
  pdf.setTextColor(...C_MUTED);
  const filtroTxt = (st.key && st.val)
    ? `Filtro aplicado: ${LABEL[st.key] || st.key} = ${st.val === '__EMPTY__' ? (EMPTY[st.key] || 'Sin informaci\u00f3n') : st.val}`
    : 'Filtro aplicado: ninguno (todas las categor\u00edas)';
  pdf.text(filtroTxt, PDF_MARGIN, PDF_CONTENT_TOP - 4);

  const kw = (PDF_W - 2*PDF_MARGIN - 3*4) / 4, kh = 24, ky = PDF_CONTENT_TOP;
  pdfKpiCard(pdf, PDF_MARGIN+0*(kw+4), ky, kw, kh, c.metric, fmt(total), '');
  pdfKpiCard(pdf, PDF_MARGIN+1*(kw+4), ky, kw, kh, second[0], typeof second[1]==='string'?second[1]:fmt(second[1]), '');
  pdfKpiCard(pdf, PDF_MARGIN+2*(kw+4), ky, kw, kh, 'Registros del per\u00edodo', fmt(r.length), '');
  pdfKpiCard(pdf, PDF_MARGIN+3*(kw+4), ky, kw, kh, fourth[0], typeof fourth[1]==='string'?fourth[1]:fmt(fourth[1]), '');

  let cursorY = ky + kh + 10;
  function ensureSpace(neededH){
    if(cursorY + neededH > PDF_BREAK_Y){
      pdfFooter(pdf);
      pdf.addPage();
      pdfHeader(pdf, title, period);
      cursorY = PDF_CONTENT_TOP;
    }
  }

  const groups = c.groups || [];
  for(let i = 0; i < groups.length; i += 2){
    const k1 = groups[i], k2 = groups[i+1];
    const items1 = group(r, k1, c.value).slice(0, 10);
    const items2 = k2 ? group(r, k2, c.value).slice(0, 10) : [];
    const rowH = 8;
    ensureSpace(9 + Math.max(items1.length, items2.length, 1)*rowH);
    const b1 = pdfFlatBars(pdf, PDF_MARGIN, cursorY, PDF_COL_W, `Detalle por ${LABEL[k1]||k1}`,
      items1, areaColor, v => fmt(v), 30, rowH);
    let b2 = b1;
    if(k2){
      b2 = pdfFlatBars(pdf, PDF_COL2_X, cursorY, PDF_COL_W, `Detalle por ${LABEL[k2]||k2}`,
        items2, areaColor, v => fmt(v), 30, rowH);
    }
    cursorY = Math.max(b1, b2) + 10;
  }

  if(c.down){
    const motivos = downGroup(r, 'MOTIVO').slice(0, 8);
    const maquinas = downGroup(r, 'NO. MAQUINA').slice(0, 8);
    const rowH = 8;
    ensureSpace(9 + Math.max(motivos.length, maquinas.length, 1)*rowH);
    const totMot = motivos.reduce((s,x)=>s+x[1],0);
    const totMaq = maquinas.reduce((s,x)=>s+x[1],0);
    const b1 = pdfFlatBars(pdf, PDF_MARGIN, cursorY, PDF_COL_W, 'Tiempo muerto por motivo',
      motivos, () => C_ALERT, v => `${time(v)} (${totMot?(v/totMot*100).toFixed(1):0}%)`, 38, rowH);
    const b2 = pdfFlatBars(pdf, PDF_COL2_X, cursorY, PDF_COL_W, 'Tiempo muerto por m\u00e1quina',
      maquinas.map(x => [`M\u00e1quina ${x[0]}`, x[1]]), () => C_ALERT,
      v => `${time(v)} (${totMaq?(v/totMaq*100).toFixed(1):0}%)`, 26, rowH);
    cursorY = Math.max(b1, b2) + 10;
  }

  pdfFooter(pdf);
  pdfFinalizePageNumbers(pdf);
  const slug = areaTitle.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
  pdf.save(`JVInternational_Informe-${slug}_Generado-${new Date().toISOString().slice(0,10)}.pdf`);
}

/* ===================================================================
   REPORTE GENERAL — mismo motor visual, con los datos agregados de
   todas las áreas.
   =================================================================== */
function pdfGeneral(){
  if(!window.jspdf){ alert('No se pudo cargar jsPDF'); return; }
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  pdf._pdfPageNumSlots = [];

  const [from, to] = range();
  const period = `${dateFmt(from)} - ${dateFmt(to)}`;

  const stats = DEPTS.map(d => {
    const rs = rows(d), c = CFG[d];
    return {area: c.title, key: d,
             accent: c.accent, total: sum(rs, c.value), down: downtime(rs), rows: rs.length};
  });
  const prod = [...stats].sort((a,b) => b.total - a.total);
  const dead = [...stats].sort((a,b) => b.down - a.down);
  const totalDown = stats.reduce((a,x) => a+x.down, 0);
  const grandTotal = stats.reduce((a,x) => a+x.total, 0);
  const colorByArea = {}; stats.forEach(x => colorByArea[x.area] = hexToRgb(x.accent));
  const areaColor = name => colorByArea[name] || [8, 119, 107];

  pdfHeader(pdf, 'Informe General de Producci\u00f3n', period);

  const kw = (PDF_W - 2*PDF_MARGIN - 3*4) / 4, kh = 24, ky = PDF_CONTENT_TOP;
  pdfKpiCard(pdf, PDF_MARGIN+0*(kw+4), ky, kw, kh, 'Mayor producci\u00f3n', fmt(prod[0]?.total||0), prod[0]?.area||'');
  pdfKpiCard(pdf, PDF_MARGIN+1*(kw+4), ky, kw, kh, 'Tiempo muerto total', time(totalDown), '');
  pdfKpiCard(pdf, PDF_MARGIN+2*(kw+4), ky, kw, kh, 'Mayor tiempo muerto', time(dead[0]?.down||0), dead[0]?.area||'');
  pdfKpiCard(pdf, PDF_MARGIN+3*(kw+4), ky, kw, kh, '\u00c1reas activas', String(stats.filter(x=>x.rows).length), 'Con registros');

  const chartY = ky + kh + 10;
  const b1 = pdfFlatBars(pdf, PDF_MARGIN, chartY, PDF_COL_W, 'Producci\u00f3n total por \u00e1rea (piezas)',
    prod.map(x => [x.area, x.total]), areaColor, v => fmt(v), 24);
  const b2 = pdfFlatBars(pdf, PDF_COL2_X, chartY, PDF_COL_W, 'Tiempo muerto por \u00e1rea',
    dead.map(x => [x.area, x.down]), () => C_ALERT, v => time(v), 24);

  const lav = rows('Lavanderia');
  const totalKg = sum(lav, 'TOTAL KGS');
  let lienzos = 0, prendas = 0;
  lav.forEach(r => { const kg = num(r['TOTAL KGS']); if(laundryType(r)==='Lienzos') lienzos += kg; else prendas += kg; });
  const lavY = Math.max(b1, b2) + 10;
  pdfFlatBars(pdf, PDF_MARGIN, lavY, PDF_COL_W, 'Resumen de lavander\u00eda (kilos)',
    [['Prendas', prendas], ['Lienzos', lienzos]],
    n => n === 'Prendas' ? [143, 191, 134] : [63, 125, 58],
    v => `${fmt(v)} kg (${totalKg ? (v/totalKg*100).toFixed(1) : 0}%)`, 22);

  pdfFooter(pdf);

  // ---- página 2 ----
  pdf.addPage();
  pdfHeader(pdf, 'Informe General de Producci\u00f3n', period);

  const all = DEPTS.flatMap(d => rows(d));
  const motivosAll = downGroup(all, 'MOTIVO');
  const maquinasAll = downGroup(all, 'NO. MAQUINA');
  const motivos = motivosAll.slice(0, 8);
  const maquinas = maquinasAll.slice(0, 8);
  const totMot = motivos.reduce((s,x)=>s+x[1], 0);
  const totMaq = maquinas.reduce((s,x)=>s+x[1], 0);

  const p2y = PDF_CONTENT_TOP;
  const mTitle = 'Principales motivos de tiempo muerto' + (motivosAll.length>8 ? ' (top 8)' : '');
  const maTitle = 'M\u00e1quinas con mayor incidencia' + (maquinasAll.length>8 ? ' (top 8)' : '');

  // Columna izquierda: motivos y máquinas apilados (uno debajo del otro).
  const m1 = pdfFlatBars(pdf, PDF_MARGIN, p2y, PDF_COL_W, mTitle,
    motivos, () => C_ALERT, v => `${time(v)} (${totMot?(v/totMot*100).toFixed(1):0}%)`, 40);
  pdfFlatBars(pdf, PDF_MARGIN, m1+10, PDF_COL_W, maTitle,
    maquinas.map(x => [`M\u00e1quina ${x[0]}`, x[1]]), () => C_ALERT,
    v => `${time(v)} (${totMaq?(v/totMaq*100).toFixed(1):0}%)`, 26);

  // Columna derecha: caso puntual — qué motivos específicos afectan a
  // cada una de las máquinas con mayor incidencia (no solo cuál falla más).
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11);
  pdf.setTextColor(...C_INK);
  pdf.text('Detalle de fallas por m\u00e1quina', PDF_COL2_X, p2y);

  const byMachine = motivosByMachine(all);
  const topMachines = maquinas.slice(0, 4);
  const cardH = 33, cardGap = 5;
  topMachines.forEach((x, i) => {
    const ma = x[0];
    const info = byMachine[ma] || {t: x[1], r: {}};
    const details = Object.entries(info.r).sort((a,b) => b[1]-a[1]).slice(0, 4)
      .map(([mo, v]) => [mo, v, info.t ? (v/info.t*100) : 0]);
    pdfMachineFailureCard(pdf, PDF_COL2_X, p2y+8+i*(cardH+cardGap), PDF_COL_W, cardH,
      `M\u00e1quina ${ma}`, info.t, details);
  });

  pdfFooter(pdf);
  pdfFinalizePageNumbers(pdf);
  pdf.save(`JVInternational_InformeGeneral_Generado-${new Date().toISOString().slice(0,10)}.pdf`);
}

fetch('data.json?v='+Date.now())
.then(r=>r.json())
.then(j=>{

  DATA=j;

  PERIOD =
    PERIOD || 'all';

  setTimeout(
  () => general(),
  10
);

})
.catch(e=>{

  document.querySelector(
    '#view'
  ).innerHTML =
    '<div class="panel"><b>No se pudo cargar data.json.</b></div>';

});
</script></body></html>
