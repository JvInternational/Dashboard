<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard de Producción</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182230;--muted:#687385;--line:#e6eaf0;--accent:#1f4f78;--accent2:#2d6f9f;--good:#237a57;--warn:#b97817;--danger:#b64747;--shadow:0 8px 28px rgba(24,34,48,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;background:#172331;color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:19px;padding:5px 10px 3px}.sub{font-size:12px;color:#aeb9c6;padding:0 10px 22px}.nav button{width:100%;border:0;background:transparent;color:#d9e1e8;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#26435d;color:#fff}.main{flex:1;padding:26px;max-width:1600px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.title{font-size:28px;font-weight:800;margin:0 0 5px}.desc{color:var(--muted);font-size:14px}.updated{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:8px}.filters{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:5px;min-width:150px}.field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}.field input,.field select{height:37px;border:1px solid #d9dee6;border-radius:7px;padding:0 9px;background:#fff;color:var(--ink)}.btn{height:37px;border:0;border-radius:7px;padding:0 13px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;color:#304154}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow)}.kpi .l{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.kpi .v{font-size:28px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px}.card h3{margin:0 0 14px;font-size:15px}.bars{display:flex;flex-direction:column;gap:9px;max-height:360px;overflow:auto}.barrow{display:grid;grid-template-columns:145px 1fr 70px;gap:9px;align-items:center;font-size:12px}.barlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#465466}.barbg{height:10px;background:#edf0f4;border-radius:10px;overflow:hidden}.barfill{height:100%;background:var(--accent2);border-radius:10px}.barval{text-align:right;font-weight:700}.trend{height:250px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid var(--line);padding:10px 2px 0;overflow:auto}.tcol{min-width:28px;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.tbar{width:100%;max-width:34px;background:var(--accent2);border-radius:5px 5px 0 0;min-height:2px}.tval{font-size:9px;color:var(--muted);white-space:nowrap}.tdate{font-size:9px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);height:38px}.tablewrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:8px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{position:sticky;top:0;background:#f4f6f9;color:#4b5868;text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:8px 9px;border-bottom:1px solid #edf0f3;white-space:nowrap}.table tr:hover td{background:#fafbfd}.empty{padding:30px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:9px}.deptgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.dept{cursor:pointer;transition:.15s}.dept:hover{transform:translateY(-2px)}.dept .num{font-size:25px;font-weight:800;margin-top:8px}.pill{display:inline-block;font-size:10px;font-weight:800;background:#edf3f8;color:var(--accent);padding:4px 7px;border-radius:99px}.footer{margin-top:20px;font-size:11px;color:var(--muted)}@media(max-width:1000px){.side{width:190px}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.deptgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.side{position:static;width:100%;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{padding:15px}.kpis,.deptgrid{grid-template-columns:1fr}.top{display:block}.updated{display:inline-block;margin-top:10px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">JV INTERNATIONAL</div><div class="sub">Dashboard de Producción</div><div class="nav" id="nav"></div></aside><main class="main"><div id="view"></div></main></div>
<script>
let DATA={};let current='General';let cfg={
'Estampado':{title:'Estampado',desc:'Producción por fecha, máquina, tipo de prenda, hit, especialidad y tiempo muerto.',metric:'Piezas trabajadas',value:'TOTAL',group:'NO. MAQUINA',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE HIT','ESPECIALIDAD','MOTIVO']},
'Neck':{title:'Neck',desc:'Producción por fecha, máquina, tipo de prenda y orden de trabajo.',metric:'Total de piezas',value:'TOTAL',group:'NO. MAQUINA',groups:['NO. MAQUINA','TIPO DE PRENDA']},
'Cuadros':{title:'Cuadros',desc:'Cantidad de cuadros por fecha, proceso, especialidad y departamento.',metric:'Total de cuadros',value:'CANT. CUADROS',group:'PROCESO',groups:['PROCESO','ESPECIALIDAD','DEPT']},
'Empaque':{title:'Empaque',desc:'Cantidad de piezas por fecha, tipo de empaque y tipo de prenda.',metric:'Total de piezas',value:'TOTAL',group:'TIPO DE EMPAQUE',groups:['TIPO DE EMPAQUE','TIPO DE PRENDA','MOTIVO']},
'Ejemplos':{title:'Ejemplos',desc:'Prendas trabajadas por departamento, cliente, tienda y especialidad.',metric:'Prendas',value:'PRENDAS',group:'DEPTO',groups:['DEPTO','CLIENTE','TIENDA','ESPECIALIDAD','TIPO DE HIT']},
'Lavanderia':{title:'Lavandería',desc:'Producción por fecha, máquina, tipo de prenda, proceso, color y tiempo muerto.',metric:'Cantidad de piezas',value:'CANTIDAD DE PIEZAS',group:'NO. MAQUINA',groups:['NO. MAQUINA','TIPO DE PRENDA','TIPO DE PROCESO','COLOR','MOTIVO']}
};
const depts=['Estampado','Neck','Cuadros','Empaque','Ejemplos','Lavanderia'];
function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function num(v){let n=Number(v);return Number.isFinite(n)?n:0}function fmt(n){return new Intl.NumberFormat('es-MX',{maximumFractionDigits:0}).format(n)}
function rows(dept){return DATA[dept]||[]}function visible(r){return true;}
function dates(rs){return rs.map(r=>r.FECHA).filter(Boolean).sort()}
function options(rs,key){return [...new Set(rs.map(r=>r[key]).filter(v=>v!==null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'es'))}
function sum(rs,key){return rs.reduce((a,r)=>a+num(r[key]),0)}
function filtered(dept){let rs=rows(dept).filter(visible);let f=document.getElementById('fFrom')?.value||'';let t=document.getElementById('fTo')?.value||'';let d=document.getElementById('fDim')?.value||'';let val=document.getElementById('fVal')?.value||'';return rs.filter(r=>(!f||String(r.FECHA)>=f)&&(!t||String(r.FECHA)<=t)&&(!d||String(r[d])===val))}
function nav(){document.getElementById('nav').innerHTML=['General',...depts].map(d=>`<button class="${current===d?'active':''}" onclick="show('${d}')">${d==='Lavanderia'?'Lavandería':d}</button>`).join('')}
function header(c){return `<div class="top"><div><h1 class="title">${esc(c.title)}</h1><div class="desc">${esc(c.desc)}</div></div><div class="updated">Datos cargados: ${esc(lastDate())}</div></div>`}
function lastDate(){let all=depts.flatMap(d=>rows(d).map(r=>r.FECHA).filter(Boolean));return all.sort().at(-1)||'—'}
function filters(dept){let rs=rows(dept).filter(visible), c=cfg[dept], ds=dates(rs);let min=ds[0]||'',max=ds.at(-1)||'';let opts=c.groups.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');return `<div class="filters"><div class="field"><label>Desde</label><input id="fFrom" type="date" value="${min}" onchange="renderDept('${dept}')"></div><div class="field"><label>Hasta</label><input id="fTo" type="date" value="${max}" onchange="renderDept('${dept}')"></div><div class="field"><label>Filtrar por</label><select id="fDim" onchange="updateValues('${dept}')"><option value="">Todos</option>${opts}</select></div><div class="field"><label>Valor</label><select id="fVal" onchange="renderDept('${dept}')"><option value="">Todos</option></select></div><button class="btn secondary" onclick="resetFilters('${dept}')">Restablecer</button><button class="btn primary" onclick="downloadCSV('${dept}')">Exportar CSV</button></div>`}
function updateValues(dept){let rs=rows(dept).filter(visible),dim=document.getElementById('fDim').value,sel=document.getElementById('fVal');sel.innerHTML='<option value="">Todos</option>'+options(rs,dim).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');renderDept(dept)}
function resetFilters(dept){renderDept(dept)}
function kpi(label,val){return `<div class="kpi"><div class="l">${esc(label)}</div><div class="v">${fmt(val)}</div></div>`}
function groupBars(rs,key,valKey){let m={};rs.forEach(r=>{let k=r[key];if(k===null||k==='')k='Sin dato';m[k]=(m[k]||0)+num(r[valKey])});let arr=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,12),mx=arr[0]?.[1]||1;return `<div class="bars">${arr.map(([k,v])=>`<div class="barrow"><div class="barlabel" title="${esc(k)}">${esc(k)}</div><div class="barbg"><div class="barfill" style="width:${Math.max(2,v/mx*100)}%"></div></div><div class="barval">${fmt(v)}</div></div>`).join('')||'<div class="empty">Sin datos</div>'}</div>`}
function trend(rs,valKey){let m={};rs.forEach(r=>{if(r.FECHA)m[r.FECHA]=(m[r.FECHA]||0)+num(r[valKey])});let arr=Object.entries(m).sort(),mx=Math.max(...arr.map(x=>x[1]),1);return `<div class="trend">${arr.map(([d,v])=>`<div class="tcol" title="${d}: ${fmt(v)}"><div class="tval">${fmt(v)}</div><div class="tbar" style="height:${Math.max(2,v/mx*190)}px"></div><div class="tdate">${d.slice(5)}</div></div>`).join('')||'<div class="empty">Sin datos</div>'}</div>`}
function table(dept,rs){let cols=Object.keys(rows(dept)[0]||{}).filter(k=>!/^Visible$/.test(k)&&k!=='Registro visible'&&!k.endsWith('_2')).slice(0,16);return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rs.slice().reverse().map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderDept(dept){current=dept;nav();let c=cfg[dept],rs=filtered(dept);let total=sum(rs,c.value);let wo=0;let down=sum(rs,'TIEMPO MUERTO (MINS)')+sum(rs,'TIEMPO MUERTO');let count=rs.length;let extra=dept==='Lavanderia'?sum(rs,'TOTAL KGS'):dept==='Cuadros'?new Set(rs.map(r=>r['PROCESO']).filter(Boolean)).size:dept==='Ejemplos'?new Set(rs.map(r=>r['CLIENTE']).filter(Boolean)).size:wo;
let k3=dept==='Lavanderia'?'Total KGS':dept==='Cuadros'?'Procesos':dept==='Ejemplos'?'Clientes':'WO contabilizadas';
document.getElementById('view').innerHTML=header(c)+filters(dept)+`<div class="kpis">${kpi(c.metric,total)}${kpi(k3,extra)}${kpi('Registros visibles',count)}${kpi('Tiempo muerto (min)',down)}</div><div class="grid"><div class="card"><h3>Producción por fecha</h3>${trend(rs,c.value)}</div><div class="card"><h3>Distribución por ${esc(c.group)}</h3>${groupBars(rs,c.group,c.value)}</div></div><div class="grid"><div class="card"><h3>Detalle por categoría</h3><div id="group2"></div></div><div class="card"><h3>Indicadores del periodo</h3><div class="note">Periodo: <b>${rs.length?rs.map(r=>r.FECHA).filter(Boolean).sort()[0]:'—'}</b> a <b>${rs.length?rs.map(r=>r.FECHA).filter(Boolean).sort().at(-1):'—'}</b></div><div class="note">La aplicación consulta los registros marcados como visibles en el archivo original.</div><div class="note">Total de registros mostrados: <b>${fmt(count)}</b></div></div></div><div class="card"><h3>Registros</h3>${table(dept,rs)}</div><div class="footer">Fuente: Bitacora de Produccion.xlsx · La pestaña “Resumen Direccion” fue excluida.</div>`;
let second=c.groups.find(x=>x!==c.group);document.getElementById('group2').innerHTML=groupBars(rs,second||c.group,c.value);updateValuesNoRender(dept)}
function updateValuesNoRender(dept){let dim=document.getElementById('fDim')?.value||'',sel=document.getElementById('fVal');if(!sel)return;let rs=rows(dept).filter(visible);sel.innerHTML='<option value="">Todos</option>'+options(rs,dim).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function show(dept){current=dept;if(dept==='General')renderGeneral();else renderDept(dept)}
function renderGeneral(){nav();let cards=depts.map(d=>{let c=cfg[d],rs=rows(d).filter(visible),v=sum(rs,c.value);return `<div class="card dept" onclick="show('${d}')"><span class="pill">${d==='Lavanderia'?'LAVANDERÍA':d.toUpperCase()}</span><div class="num">${fmt(v)}</div><div class="desc">${esc(c.metric)}</div><div class="note">${fmt(rs.length)} registros visibles</div></div>`}).join('');document.getElementById('view').innerHTML=`<div class="top"><div><h1 class="title">Dashboard de Producción</h1><div class="desc">Consulta web de la bitácora de producción. Selecciona un área para analizar sus indicadores.</div></div><div class="updated">Último registro: ${esc(lastDate())}</div></div><div class="card" style="margin-bottom:16px"><h3>Áreas de producción</h3><div class="deptgrid">${cards}</div></div><div class="grid"><div class="card"><h3>Resumen de actividad</h3>${depts.map(d=>{let c=cfg[d],rs=rows(d).filter(visible),v=sum(rs,c.value);return `<div class="barrow" style="margin:12px 0"><div class="barlabel">${esc(d==='Lavanderia'?'Lavandería':d)}</div><div class="barbg"><div class="barfill" style="width:${Math.max(2,v/Math.max(...depts.map(x=>sum(rows(x).filter(visible),cfg[x].value)),1)*100)}%"></div></div><div class="barval">${fmt(v)}</div></div>`}).join('')}</div><div class="card"><h3>Alcance</h3><div class="note">Incluye Estampado, Neck, Cuadros, Empaque, Ejemplos y Lavandería.</div><div class="note">La pestaña <b>Resumen Direccion</b> no forma parte de esta aplicación.</div><div class="note">Los datos están integrados en la aplicación para consulta. Los datos se actualizan automáticamente desde la bitácora conectada a Google Drive.</div></div></div><div class="footer">Fuente: Bitacora de Produccion.xlsx · Aplicación de consulta</div>`}
function downloadCSV(dept){let rs=filtered(dept),cols=Object.keys(rows(dept)[0]||{}).filter(k=>k!=='Visible'&&!k.endsWith('_2'));let csv='\ufeff'+[cols.join(','),...rs.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`${dept}_filtrado.csv`;a.click();URL.revokeObjectURL(a.href)}
fetch('data.json?v=' + Date.now()).then(r=>r.json()).then(d=>{DATA=d;renderGeneral()}).catch(e=>{document.getElementById('view').innerHTML='<div class="card"><h2>No se pudo cargar data.json</h2><p>Verifica que data.json esté en la misma carpeta que index.html.</p></div>'});
</script></body></html>
